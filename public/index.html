  </div>`;

  // Classes
  const clsCounts=CLS.map(c=>({...c,count:entries.filter(e=>e.className===c.n).length})).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
  const mxCls=Math.max(1,...clsCounts.map(c=>c.count));

  let clsHtml=`<div class="card"><div class="card-t">Klassenverteilung</div>
    ${clsCounts.map(c=>`<div class="bar-row">
      <span class="bar-lbl" style="color:${c.c}">${c.n}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${c.count/mxCls*100}%;background:${c.c}40"></div><span class="bar-val" style="color:${c.c}">${c.count}\u00D7</span></div>
    </div>`).join("")}
  </div>`;

  // Best slots detail (hourly aggregation)
  const hd=heatData();
  const best=Object.entries(hd).sort((a,b)=>b[1].total-a[1].total).filter(([,v])=>v.total>0).slice(0,3);

  let bestHtml=`<div class="card"><div class="card-t">Beste Raidzeiten \u2014 Details</div>
    ${best.map(([k,dat],i)=>{
      const sep=k.indexOf("_"),d=k.substring(0,sep),hl=k.substring(sep+1);
      const players=avForSlot(d,hl);
      const rr=isRaidReady(players);
      const byRole=ROLES.map(r=>({r,ps:players.filter(p=>(p.roles||[]).includes(r))}));
      return`<div class="bs-card" style="background:${i===0?"rgba(201,168,76,.06)":"rgba(255,255,255,.015)"};border:1px solid ${i===0?"rgba(201,168,76,.2)":"rgba(255,255,255,.04)"}">
        <div class="bs-hdr"><span class="rank" style="color:${i===0?"var(--gold)":"#9a92a8"}">#${i+1} ${d} ${hl}:00</span><span class="avail">${dat.total} verf\u00FCgbar${dat.tent>0?` (${dat.tent} vielleicht)`:""}</span>${rr.ready?'<span class="badge-rr">Raid-Ready!</span>':""}</div>
        <div class="bs-roles">${byRole.map(({r,ps})=>`
          <div class="bs-role">
            <div class="bs-role-t" style="color:${RC[r]}">${RI[r]} ${r} (${ps.length})</div>
            ${ps.length?ps.map(p=>`<div class="bs-player" style="color:${p._availType==="tentative"?"var(--ylw)":cc(p.className)}">${p._availType==="tentative"?"(?) ":""}${h(p.charName)}</div>`).join(""):`<div style="font-size:11px;color:var(--tx5)">\u2014</div>`}
          </div>
        `).join("")}</div>
      </div>`;
    }).join("")}
  </div>`;

  // Player availability ranking (count individual 15-min slots, both yes and tentative)
  const pSlots=entries.map(e=>{
    const cnt=DAYS.reduce((s,d)=>s+SLOTS.filter(sl=>e.availability?.[d+"_"+sl]).length,0);
    return{...e,sc:cnt};
  }).sort((a,b)=>b.sc-a.sc);
  const mxSl=Math.max(1,...pSlots.map(p=>p.sc));

  let playerHtml=`<div class="card"><div class="card-t">Verf\u00FCgbarkeit pro Spieler</div>
    ${pSlots.map(p=>`<div class="pbar-row">
      <span class="pbar-name" style="color:${cc(p.className)}">${h(p.charName)}</span>
      <div class="pbar-track"><div class="pbar-fill" style="width:${p.sc/mxSl*100}%"></div></div>
      <span class="pbar-val">${p.sc} Slots</span>
    </div>`).join("")}
  </div>`;

  el.innerHTML=roleHtml+clsHtml+bestHtml+playerHtml;
}

const DAY_NAMES_SHORT=["So","Mo","Di","Mi","Do","Fr","Sa"];
function fmtDate(ds){
  const d=new Date(ds+"T00:00:00");
  const dn=DAY_NAMES_SHORT[d.getDay()];
  return dn+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function fmtDeadline(iso){
  const d=new Date(iso);
  const dn=DAY_NAMES_SHORT[d.getDay()];
  return dn+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+". "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" Uhr";
}
function isRaidPast(raid){
  const now=new Date();
  const rd=new Date(raid.date+"T"+raid.time+":00");
  return rd<now;
}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

async function loadRaids(){
  try{
    const r=await fetch(RAID_API,{headers:authHeader()});
    if(!r.ok)throw new Error("Laden fehlgeschlagen");
    const data=await r.json();
    raids=Array.isArray(data)?data:[];
  }catch(e){console.error(e);raids=[]}
}

async function saveRaid(data){
  const r=await fetch(RAID_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify(data)});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Speichern fehlgeschlagen")}
  return r.json();
}

async function delRaid(id){
  const r=await fetch(RAID_API+"?id="+encodeURIComponent(id),{method:"DELETE",headers:authHeader()});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Löschen fehlgeschlagen")}
}

function filteredRaids(){
  if(raidSizeFilter==="all")return raids;
  const sz=parseInt(raidSizeFilter);
  return raids.filter(r=>r.maxPlayers===sz);
}

function renderRaids(){
  const el=document.getElementById("v-raids");

  if(raidView==="create"||raidView==="edit"){
    renderRaidForm(el);
    return;
  }

  // View mode toggle: Übersicht / Woche / Monat
  let html=`<div class="raid-tab-toggle">
    <button class="rt-btn${raidCalMode==="list"?" active":""}" onclick="raidCalMode='list';renderRaids()">Übersicht</button>
    <button class="rt-btn${raidCalMode==="week"?" active":""}" onclick="raidCalMode='week';renderRaids()">Woche</button>
    <button class="rt-btn${raidCalMode==="month"?" active":""}" onclick="raidCalMode='month';renderRaids()">Monat</button>
    ${currentUser?`<button class="rt-btn" onclick="raidView='create';raidEditId=null;raidForm={instance:'',date:'',time:'20:00',maxPlayers:25,notes:'',description:'',deadline:''};renderRaids()">+ Raid erstellen</button>`:""}
  </div>`;

  // Size filter
  html+=`<div class="raid-filter-bar">
    <span class="rf-label">Größe:</span>
    <button class="rf-btn${raidSizeFilter==="all"?" active":""}" onclick="raidSizeFilter='all';renderRaids()">Alle</button>
    <button class="rf-btn${raidSizeFilter==="10"?" active":""}" onclick="raidSizeFilter='10';renderRaids()">10er</button>
    <button class="rf-btn${raidSizeFilter==="25"?" active":""}" onclick="raidSizeFilter='25';renderRaids()">25er</button>
  </div>`;

  if(!currentUser){
    html+=`<div class="auth-hint">Melde dich an, um Raids zu erstellen oder dich anzumelden.<br><button onclick="renderAuthOverlay(true)">Anmelden</button></div>`;
  }

  const fr=filteredRaids();

  if(raidCalMode==="week"){
    html+=renderRaidWeek(fr);
    el.innerHTML=html;
    return;
  }
  if(raidCalMode==="month"){
    html+=renderRaidMonth(fr);
    el.innerHTML=html;
    return;
  }

  // List view (default)
  if(!fr.length){
    html+=`<div class="empty">Noch keine Raids geplant.</div>`;
    el.innerHTML=html;
    return;
  }

  const upcoming=fr.filter(r=>!isRaidPast(r));
  const past=fr.filter(r=>isRaidPast(r));

  if(upcoming.length){
    html+=`<div class="sec-l" style="margin-bottom:10px">Kommende Raids (${upcoming.length})</div>`;
    html+=`<div class="raid-list">${upcoming.map(r=>renderRaidCard(r,false)).join("")}</div>`;
  }
  if(past.length){
    html+=`<div class="sec-l" style="margin:20px 0 10px">Vergangene Raids (${past.length})</div>`;
    html+=`<div class="raid-list">${past.map(r=>renderRaidCard(r,true)).join("")}</div>`;
  }

  el.innerHTML=html;
}

// ── Calendar: Weekly View ──
function renderRaidWeek(fr){
  const DAY_FULL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const DAY_SHORT=["So","Mo","Di","Mi","Do","Fr","Sa"];
  // Get Monday of current week
  const ref=new Date(raidCalDate);
  const day=ref.getDay();
  const diff=day===0?-6:1-day;
  const mon=new Date(ref);mon.setDate(ref.getDate()+diff);mon.setHours(0,0,0,0);

  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const todayS=todayStr();

  // Navigation
  let out=`<div class="cal-nav">
    <button class="cal-nav-btn" onclick="raidCalDate.setDate(raidCalDate.getDate()-7);renderRaids()">\u276E</button>
    <span class="cal-title">${String(mon.getDate()).padStart(2,"0")}.${String(mon.getMonth()+1).padStart(2,"0")}. \u2013 ${String(sun.getDate()).padStart(2,"0")}.${String(sun.getMonth()+1).padStart(2,"0")}.${sun.getFullYear()}</span>
    <button class="cal-nav-btn" onclick="raidCalDate.setDate(raidCalDate.getDate()+7);renderRaids()">\u276F</button>
    <button class="cal-nav-btn" onclick="raidCalDate=new Date();renderRaids()">Heute</button>
  </div>`;

  // Build day-by-day rows (Mon–Sun)
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const isToday=ds===todayS;
    const dayRaids=fr.filter(r=>r.date===ds).sort((a,b)=>a.time.localeCompare(b.time));

    out+=`<div class="cal-week-row${isToday?" today":""}">
      <div class="cal-week-hdr">
        <span class="cal-week-day">${DAY_FULL[d.getDay()]}</span>
        <span class="cal-week-day-date">${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.</span>
        ${!dayRaids.length?`<span class="cal-week-noraids">Keine Raids</span>`:""}
      </div>`;
    if(dayRaids.length){
      out+=`<div class="cal-week-raids">`;
      dayRaids.forEach(r=>{
        const signups=(r.signups||[]).filter(s=>s.status!=="declined");
        const szCls=r.maxPlayers<=10?"r10":"r25";
        const fillPct=Math.min(100,Math.round(signups.length/r.maxPlayers*100));
        const fillColor=signups.length>=r.maxPlayers?"var(--grn)":fillPct>=60?"var(--ylw)":"var(--tx3)";
        out+=`<div class="cal-week-card ${szCls}" onclick="scrollToRaid('${r.id}')">
          <span class="cal-week-inst">${h(r.instance)}</span>
          <div class="cal-week-meta">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${r.time} Uhr</span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${r.maxPlayers} Spieler</span>
          </div>
          <span class="cal-week-signup" style="color:${fillColor}">${signups.length}/${r.maxPlayers}</span>
        </div>`;
      });
      out+=`</div>`;
    }
    out+=`</div>`;
  }
  return out;
}

// ── Calendar: Monthly View ──
function renderRaidMonth(fr){
  const MONTH_NAMES=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const DAY_HDR=["Mo","Di","Mi","Do","Fr","Sa","So"];

  const year=raidCalDate.getFullYear();
  const month=raidCalDate.getMonth();
  const todayS=todayStr();

  // Navigation
  let out=`<div class="cal-nav">
    <button class="cal-nav-btn" onclick="raidCalDate.setMonth(raidCalDate.getMonth()-1);renderRaids()">\u276E</button>
    <span class="cal-title">${MONTH_NAMES[month]} ${year}</span>
    <button class="cal-nav-btn" onclick="raidCalDate.setMonth(raidCalDate.getMonth()+1);renderRaids()">\u276F</button>
    <button class="cal-nav-btn" onclick="raidCalDate=new Date();renderRaids()">Heute</button>
  </div>`;

  // Header row
  out+=`<div class="cal-grid">`;
  DAY_HDR.forEach(d=>{out+=`<div class="cal-hdr">${d}</div>`});

  // First day of month
  const first=new Date(year,month,1);
  // Day of week (Mon=0, Sun=6)
  let startDow=first.getDay()-1;if(startDow<0)startDow=6;

  // Days in month
  const daysInMonth=new Date(year,month+1,0).getDate();

  // Fill leading cells from previous month
  const prevMonthDays=new Date(year,month,0).getDate();
  for(let i=startDow-1;i>=0;i--){
    const d=prevMonthDays-i;
    const pm=month===0?11:month-1;
    const py=month===0?year-1:year;
    const ds=py+"-"+String(pm+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dayRaids=fr.filter(r=>r.date===ds);
    out+=renderCalDay(d,ds,dayRaids,true,todayS);
  }

  // Current month days
  for(let d=1;d<=daysInMonth;d++){
    const ds=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dayRaids=fr.filter(r=>r.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
    out+=renderCalDay(d,ds,dayRaids,false,todayS);
  }

  // Fill trailing cells
  const totalCells=startDow+daysInMonth;
  const rem=totalCells%7;
  if(rem>0){
    const nm=month===11?0:month+1;
    const ny=month===11?year+1:year;
    for(let d=1;d<=7-rem;d++){
      const ds=ny+"-"+String(nm+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const dayRaids=fr.filter(r=>r.date===ds);
      out+=renderCalDay(d,ds,dayRaids,true,todayS);
    }
  }

  out+=`</div>`;
  return out;
}

function renderCalDay(dayNum,ds,dayRaids,isOther,todayS){
  const isToday=ds===todayS;
  let cls="cal-day";
  if(isToday)cls+=" today";
  if(isOther)cls+=" other-month";
  let c=`<div class="${cls}"><div class="cal-day-num">${dayNum}</div>`;
  dayRaids.forEach(r=>{
    const szCls=r.maxPlayers<=10?"r10":"r25";
    const signups=(r.signups||[]).filter(s=>s.status!=="declined");
    c+=`<div class="cal-raid ${szCls}" onclick="scrollToRaid('${r.id}')" title="${h(r.instance)} — ${r.time} Uhr — ${signups.length}/${r.maxPlayers}">
      <span class="cal-raid-time">${r.time}</span>${h(r.instance)}
      <div class="cal-raid-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${r.time}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${signups.length}
      </div>
    </div>`;
  });
  c+=`</div>`;
  return c;
}

const _compOpen={};
function renderRaidComp(raid,signups,declined,counts){
  const {t,hl,dp,tgtTank,tgtHeal,tgtDps}=counts;

        <div class="rc-target-count">${hl}</div>
        <div class="rc-target-max">von ${tgtHeal} ben\u00F6tigt</div>
      </div>
      <div class="rc-target ${dState}">
        <div class="rc-target-label" style="color:var(--dps)">\u2694\uFE0F DPS</div>
        <div class="rc-target-count">${dp}</div>
        <div class="rc-target-max">von ${tgtDps} ben\u00F6tigt</div>
      </div>
    </div>`;

    // Class distribution
    const clsCounts={};
    signups.forEach(s=>{if(s.className)clsCounts[s.className]=(clsCounts[s.className]||0)+1});
    const clsEntries=Object.entries(clsCounts).sort((a,b)=>b[1]-a[1]);
    if(clsEntries.length){
      const maxCt=clsEntries[0][1];
      html+=`<div class="rc-classes">`;
      clsEntries.forEach(([cls,ct])=>{
        const w=Math.max(4,Math.round(ct/maxCt*100));
        html+=`<div class="rc-cls-row">
          <span class="rc-cls-name" style="color:${cc(cls)}"><img class="wow-ico-sm" src="${clsIcon(cls)}" alt="" loading="lazy"> ${h(cls)}</span>
          <div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.04)"><div class="rc-cls-bar" style="width:${w}%;background:${cc(cls)}"></div></div>
          <span class="rc-cls-ct">${ct}</span>
        </div>`;
      });
      html+=`</div>`;
    }

    // Lineup suggestion
    if(comp.lineup.length){
      html+=`<div class="rc-section">
        <div class="rc-section-t"><span style="color:var(--grn)">\u2705</span> Aufstellung (${comp.lineup.length}/${raid.maxPlayers})</div>
        <div class="rc-lineup">${comp.lineup.map(s=>`<span class="rc-player in${s.status==="tentative"?" tentative":""}${s.status==="confirmed"?" confirmed":""}" style="color:${s.className?cc(s.className):"var(--tx)"}">${s.status==="confirmed"?"\u2705 ":""}${s.className?`<img class="wow-ico-sm" src="${clsIcon(s.className)}" alt="" loading="lazy">`:""} ${h(s.charName)} <span style="font-size:10px;color:var(--tx4)">${s.assignedSpec||s.role}</span></span>`).join("")}</div>
      </div>`;
    }

    // Bench
    if(comp.bench.length){
      html+=`<div class="rc-section">
        <div class="rc-section-t"><span style="color:var(--ylw)">\u{1F4A4}</span> Bank (${comp.bench.length})</div>
        <div class="rc-lineup">${comp.bench.map(s=>`<span class="rc-player bench" style="color:${s.className?cc(s.className):"var(--ylw)"}">${s.className?`<img class="wow-ico-sm" src="${clsIcon(s.className)}" alt="" loading="lazy">`:""} ${h(s.charName)} <span style="font-size:10px;color:var(--tx4)">${s.role}</span></span>`).join("")}</div>
        <div class="rc-note">\u{1F4A1} Vorschlag basiert auf Rollenverteilung — finale Entscheidung liegt beim Raidleiter.</div>
      </div>`;
    }

    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

// Build raid composition: suggest who's in and who's benched
function buildRaidComp(raid,signups){
  const max=raid.maxPlayers;
  const is10=max<=10;
  const tgtTank=is10?2:RR_TANK, tgtHeal=is10?2:RR_HEAL, tgtDps=is10?6:RR_DPS;

  // Separate by status priority: confirmed > accepted > tentative
  const confirmedS=signups.filter(s=>s.status==="confirmed");
  const conf=signups.filter(s=>s.status==="accepted");
  const tent=signups.filter(s=>s.status==="tentative");

  const lineup=[];
  const bench=[];
  const roleFilled={Tank:0,Heiler:0,DPS:0};

  // Priority: fill role targets with confirmed first, then tentative
  function tryPlace(player){
    const role=player.assignedSpec?specRole(player.className,player.assignedSpec):player.role;
    const tgt=role==="Tank"?tgtTank:role==="Heiler"?tgtHeal:tgtDps;
    if(roleFilled[role]<tgt&&lineup.length<max){
      lineup.push(player);
      roleFilled[role]++;
      return true;
    }
    return false;
  }

  // Pass 0: place confirmed (bestätigt) players first — they always get in
  const confirmedRemaining=[];
  confirmedS.forEach(s=>{
    if(!tryPlace(s))confirmedRemaining.push(s);
  });

  // Pass 1: place accepted into their primary roles
  const confRemaining=[];
  conf.forEach(s=>{
    if(!tryPlace(s))confRemaining.push(s);
  });

  // Pass 2: place tentative into primary roles
  const tentRemaining=[];
  tent.forEach(s=>{
    if(!tryPlace(s))tentRemaining.push(s);
  });

  // Pass 3: fill remaining spots with overflow (up to max)
  [...confirmedRemaining,...confRemaining,...tentRemaining].forEach(s=>{
    if(lineup.length<max){
      lineup.push(s);
      roleFilled[s.role]++;
    }else{
      bench.push(s);
    }
  });

  return{lineup,bench};
}

// ── Karazhan group suggestion ──
// When a Karazhan raid has >10 signups, suggest balanced 10-man groups
const _karaGroupsOpen={};
const KARA_TANKS=2, KARA_HEALERS=2, KARA_DPS=6, KARA_SIZE=10;

function suggestKaraGroups(signups){
  // Separate by role
  const tanks=[], healers=[], dps=[];
  // Confirmed first, then accepted, then tentative
  const sorted=[...signups.filter(s=>s.status==="confirmed"),...signups.filter(s=>s.status==="accepted"),...signups.filter(s=>s.status==="tentative")];
  sorted.forEach(s=>{
    const role=s.assignedSpec?specRole(s.className,s.assignedSpec):s.role;
    if(role==="Tank")tanks.push(s);
    else if(role==="Heiler")healers.push(s);
    else dps.push(s);
  });

  const numGroups=Math.max(1,Math.ceil(sorted.length/KARA_SIZE));
  const groups=Array.from({length:numGroups},()=>({players:[],tanks:0,healers:0,dps:0}));

  // Round-robin distribute, smallest group first, respecting role targets
  function distribute(pool,role,perGroup){
    pool.forEach(player=>{
      // Find group with fewest of this role, then fewest total
      const eligible=[...groups].sort((a,b)=>{
        const ra=role==="Tank"?a.tanks:role==="Heiler"?a.healers:a.dps;
        const rb=role==="Tank"?b.tanks:role==="Heiler"?b.healers:b.dps;
        if(ra!==rb)return ra-rb;
        return a.players.length-b.players.length;
      });
      const g=eligible[0];
      g.players.push(player);
      if(role==="Tank")g.tanks++;
      else if(role==="Heiler")g.healers++;
      else g.dps++;
    });
  }

  distribute(tanks,"Tank",KARA_TANKS);
  distribute(healers,"Heiler",KARA_HEALERS);
  distribute(dps,"DPS",KARA_DPS);

  // Diversify classes within groups: try swapping same-role players between groups
  // to avoid duplicate classes in one group
  for(let pass=0;pass<3;pass++){
    for(let gi=0;gi<groups.length;gi++){
      for(let gj=gi+1;gj<groups.length;gj++){
        const ga=groups[gi], gb=groups[gj];
        for(let ai=0;ai<ga.players.length;ai++){
          for(let bi=0;bi<gb.players.length;bi++){
            const pa=ga.players[ai], pb=gb.players[bi];
            const ra=pa.assignedSpec?specRole(pa.className,pa.assignedSpec):pa.role;
            const rb=pb.assignedSpec?specRole(pb.className,pb.assignedSpec):pb.role;
            if(ra!==rb)continue; // only swap same-role
            // Count class duplicates before/after swap
            const dupsBefore=classDupes(ga.players)+classDupes(gb.players);
            ga.players[ai]=pb; gb.players[bi]=pa;
            const dupsAfter=classDupes(ga.players)+classDupes(gb.players);
            if(dupsAfter>=dupsBefore){
              ga.players[ai]=pa; gb.players[bi]=pb; // revert
            }
          }
        }
      }
    }
  }

  return groups;
}

function classDupes(players){
  const counts={};
  players.forEach(p=>{if(p.className)counts[p.className]=(counts[p.className]||0)+1});
  return Object.values(counts).reduce((sum,c)=>sum+Math.max(0,c-1),0);
}

function renderKaraGroups(raid,signups){
  const rid=raid.id;
  const isOpen=_karaGroupsOpen[rid];
  const groups=suggestKaraGroups(signups);
  const numGroups=groups.length;

  let html=`<div class="raid-comp" style="border-top:1px solid rgba(201,168,76,.15)">`;
  html+=`<button class="raid-comp-toggle" onclick="_karaGroupsOpen['${rid}']=!_karaGroupsOpen['${rid}'];renderRaids()">
    ${isOpen?"\u25BE":"\u25B8"} Gruppenvorschlag (${numGroups} Gruppen \u00E0 max. ${KARA_SIZE})
  </button>`;

  if(isOpen){
    html+=`<div class="raid-comp-body">`;
    html+=`<div class="rc-note" style="margin-bottom:12px">\u2139\uFE0F Automatischer Vorschlag f\u00FCr ${numGroups} Karazhan-Gruppe${numGroups>1?"n":""}. Jede Gruppe ben\u00F6tigt ${KARA_TANKS} Tanks + ${KARA_HEALERS} Heiler + ${KARA_DPS} DPS.</div>`;

    html+=`<div class="kara-groups">`;
    groups.forEach((g,i)=>{
      const tankOk=g.tanks>=KARA_TANKS, healOk=g.healers>=KARA_HEALERS;
      const statusIcon=tankOk&&healOk&&g.players.length>=KARA_SIZE?"\u2705":"\u26A0\uFE0F";

      html+=`<div class="kara-group">`;
      html+=`<div class="kara-group-hdr">
        <span class="kara-group-title">${statusIcon} Gruppe ${i+1}</span>
        <span class="kara-group-count">${g.players.length}/${KARA_SIZE}</span>
      </div>`;

      // Role gauges
      html+=`<div class="kara-roles">
        <span class="kara-role${g.tanks>=KARA_TANKS?" ok":""}" style="color:var(--tank)">\u{1F6E1}\uFE0F ${g.tanks}/${KARA_TANKS}</span>
        <span class="kara-role${g.healers>=KARA_HEALERS?" ok":""}" style="color:var(--heal)">\u{1F49A} ${g.healers}/${KARA_HEALERS}</span>
        <span class="kara-role" style="color:var(--dps)">\u2694\uFE0F ${g.dps}/${KARA_DPS}</span>
      </div>`;

      // Player list grouped by role
      ["Tank","Heiler","DPS"].forEach(role=>{
        const rs=g.players.filter(s=>{
          const r=s.assignedSpec?specRole(s.className,s.assignedSpec):s.role;
          return r===role;
        });
        if(!rs.length)return;
        rs.forEach(s=>{
          const tent=s.status==="tentative";
          html+=`<div class="kara-player${tent?" tentative":""}">
            ${s.className?`<img class="wow-ico-sm" src="${clsIcon(s.className)}" alt="" loading="lazy">`:""}
            <span style="color:${s.className?cc(s.className):"var(--tx)"};font-weight:600">${h(s.charName)}</span>
            <span class="kara-player-spec" style="color:${RC[role]}">${s.assignedSpec||role}</span>
          </div>`;
        });
      });

      html+=`</div>`;
    });
    html+=`</div>`;

    html+=`<div class="rc-note">\u{1F4A1} Vorschlag basiert auf Rollenverteilung und Klassenvielfalt — finale Entscheidung liegt beim Raidleiter.</div>`;
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

function renderSuSpecs(raidId,cls){
  const specs=CLASS_SPECS[cls]||[];
  const sel=_suSpecs[raidId]||[];
  if(!specs.length)return`<span style="font-size:12px;color:var(--tx4)">Klasse w\u00E4hlen</span>`;
  return specs.map(sp=>{
    const on=sel.includes(sp.n);
    const col=RC[sp.r];
    return`<div class="rchip${on?" active":""}" style="font-size:12px;padding:6px 8px;${on?`border-color:${col};color:${col};background:${col}18`:""}" onclick="toggleSuSpec('${raidId}','${sp.n}')"><img class="wow-ico-sm" src="${WOW_ICONS}/spec/${sp.i}.png" alt="" loading="lazy">${sp.n}</div>`;
  }).join("");
}

window.toggleSuSpec=function(raidId,specName){

window.orgaCharChanged=function(raidId){
  const sel=document.getElementById("orga-char-"+raidId);
  const nameInput=document.getElementById("orga-charname-"+raidId);
  const classSelect=document.getElementById("orga-class-"+raidId);
  const uidInput=document.getElementById("orga-uid-"+raidId);
  const clsInput=document.getElementById("orga-cls-"+raidId);
  if(!sel)return;
  if(sel.value==="__custom__"){
    nameInput.style.display="";
    classSelect.style.display="";
    uidInput.value="";
    clsInput.value="";
  }else{
    nameInput.style.display="none";
    classSelect.style.display="none";
    const opt=sel.selectedOptions[0];
    uidInput.value=opt?.dataset.uid||"";
    clsInput.value=opt?.dataset.cls||"";
  }
};

window.doOrgaSignup=async function(raidId){
  const sel=document.getElementById("orga-char-"+raidId);
  let charName,className,targetUserId;
  if(sel.value==="__custom__"||!sel.value){
    charName=(document.getElementById("orga-charname-"+raidId)?.value||"").trim();
    className=document.getElementById("orga-class-"+raidId)?.value||"";
    targetUserId="";
  }else{
    charName=sel.value;
    className=document.getElementById("orga-cls-"+raidId)?.value||"";
    targetUserId=document.getElementById("orga-uid-"+raidId)?.value||"";
  }
  const role=document.getElementById("orga-role-"+raidId)?.value||"DPS";
  const status=document.getElementById("orga-status-"+raidId)?.value||"accepted";
  const note=(document.getElementById("orga-note-"+raidId)?.value||"").trim();

  if(!charName){toast("Bitte Charakter angeben");return}

  try{
    await saveRaid({action:"signup-other",raidId,charName,className,role,status,note,targetUserId:targetUserId||undefined});
    toast(h(charName)+" angemeldet \u2713");
    await loadRaids();
    renderRaids();
  }catch(e){toast("Fehler: "+e.message)}
};

async function loadDkp(){
  try{
    const r=await fetch(DKP_API,{headers:authHeader()});
    if(!r.ok)throw new Error("Laden fehlgeschlagen");
    const d=await r.json();
    dkpBalances=d.balances||[];dkpTransactions=d.transactions||[];
    if(d.config){dkpConfig=d.config;dkpDecayPercent=dkpConfig.defaultDecayPercent||15}
  }catch(e){console.error(e)}
}

function getDkpRole(){
  if(!currentUser||!dkpConfig.roles)return null;
  return dkpConfig.roles[currentUser.username.toLowerCase()]||null;
}
function isDkpAdmin(){return getDkpRole()==="admin"}
function isDkpOfficer(){const r=getDkpRole();return r==="admin"||r==="officer"}

function syncDkpAwardUi(){
  const btn=document.getElementById("dkp-award-btn");
  if(btn){
    if(dkpAwardPlayers.length&&dkpAwardAmount&&dkpAwardReason)btn.removeAttribute("disabled");
    else btn.setAttribute("disabled","");
  }
  const prev=document.getElementById("dkp-award-preview");
  if(prev){
    if(dkpAwardPlayers.length&&dkpAwardAmount){
      prev.innerHTML=dkpAwardPlayers.length+' Spieler × '+h(dkpAwardAmount)+' DKP = <strong style="color:var(--grn)">'+dkpAwardPlayers.length*Number(dkpAwardAmount)+' DKP</strong> gesamt';
      prev.style.display="";
    }else{prev.style.display="none"}
  }
}

function syncDkpSpendUi(){
  const btn=document.getElementById("dkp-spend-btn");
  if(btn){
    if(dkpSpendPlayer&&dkpSpendAmount)btn.removeAttribute("disabled");
    else btn.setAttribute("disabled","");
  }
}

function dkpSortedBalances(){
  const list=[...dkpBalances];
  const dir=dkpSortDir==="asc"?1:-1;
  list.sort((a,b)=>{
    if(dkpSortCol==="name")return dir*a.playerName.localeCompare(b.playerName);
    if(dkpSortCol==="class")return dir*(a.className||"").localeCompare(b.className||"");
    return dir*(a.balance-b.balance);
  });
  return list;
}

function renderDkp(){
  const el=document.getElementById("v-dkp");
  const admin=isDkpAdmin();
  const officer=isDkpOfficer();

  // Find current user's DKP entry for "Mein DKP" button
  const myDkp=currentUser?dkpBalances.find(b=>{
    const lower=b.playerName.toLowerCase();
    const uLower=currentUser.username.toLowerCase();
    return lower===uLower||lower===uLower.split("#")[0];
  })||entries.find(e=>e.userId===currentUser.userId):null;

  let html=`<div class="dkp-actions-bar">
    <button class="ht-btn${dkpView==="overview"?" active":""}" onclick="dkpView='overview';dkpPlayerDetail=null;renderDkp()">Übersicht</button>
    ${currentUser&&myDkp?`<button class="ht-btn dkp-my-btn${dkpView==="mydkp"?" active":""}" onclick="dkpShowMyDkp()">Mein DKP</button>`:""}
    ${officer?`<button class="ht-btn${dkpView==="award"?" active":""}" onclick="dkpView='award';renderDkp()">Vergeben</button>
    <button class="ht-btn${dkpView==="spend"?" active":""}" onclick="dkpView='spend';renderDkp()">Beute</button>`:""}
    ${admin?`<button class="ht-btn${dkpView==="decay"?" active":""}" onclick="dkpView='decay';renderDkp()">Verfall</button>
    <button class="ht-btn${dkpView==="settings"?" active":""}" onclick="dkpView='settings';renderDkp()">Einstellungen</button>`:""}
  </div>`;

  if(dkpView==="award"&&officer){html+=renderDkpAward()}
  else if(dkpView==="spend"&&officer){html+=renderDkpSpend()}
  else if(dkpView==="decay"&&admin){html+=renderDkpDecay()}
  else if(dkpView==="settings"&&admin){html+=renderDkpSettings()}
  else{html+=renderDkpOverview()}

  el.innerHTML=html;
  if(typeof $WowheadPower!=="undefined")$WowheadPower.refreshLinks();
}

function renderDkpOverview(){
  let html="";
  const admin=isDkpAdmin();
  const sorted=dkpSortedBalances();

  // Toolbar: CSV export + Undo
  html+=`<div class="dkp-toolbar">`;
  html+=`<button class="dkp-toolbar-btn" onclick="exportDkpCsv()">CSV Export</button>`;
  if(admin&&dkpTransactions.length){
    html+=`<button class="dkp-toolbar-btn dkp-undo" onclick="doDkpUndo()">Rückgängig</button>`;
  }
  html+=`</div>`;

  // Player detail view
  if(dkpPlayerDetail){
    html+=renderDkpPlayerDetail();
    return html;
  }

  // Search bar
  html+=`<div class="dkp-search"><input type="text" id="dkp-search-input" value="${h(dkpSearchQuery)}" placeholder="Spieler suchen…" oninput="dkpSearchQuery=this.value;renderDkp()"></div>`;

  // Filter standings by search
  const filtered=dkpSearchQuery?sorted.filter(b=>b.playerName.toLowerCase().includes(dkpSearchQuery.toLowerCase())||((b.className||"").toLowerCase().includes(dkpSearchQuery.toLowerCase()))):sorted;

  // Standings table
  html+=`<div class="card"><div class="card-t">DKP-Übersicht${filtered.length!==sorted.length?` <span style="font-size:12px;color:var(--tx4);font-weight:400">(${filtered.length} von ${sorted.length})</span>`:""}</div>`;
  if(!sorted.length){
    html+=`<div class="empty">Noch keine DKP-Einträge. Vergib DKP über den "Vergeben"-Tab.</div>`;
  }else if(!filtered.length){
    html+=`<div class="empty">Keine Treffer für „${h(dkpSearchQuery)}"</div>`;
  }else{
    const sortArrow=c=>dkpSortCol===c?(dkpSortDir==="asc"?"▲":"▼"):"";
    const sortCls=c=>dkpSortCol===c?" dkp-sort-active":"";
    html+=`<div style="overflow-x:auto"><table class="dkp-standings">
      <thead><tr>
        <th>#</th>
        <th class="${sortCls("name")}" onclick="dkpSortBy('name')">Spieler<span class="dkp-sort-arrow">${sortArrow("name")}</span></th>
        <th class="${sortCls("class")}" onclick="dkpSortBy('class')">Klasse<span class="dkp-sort-arrow">${sortArrow("class")}</span></th>
        <th class="${sortCls("balance")}" style="text-align:right" onclick="dkpSortBy('balance')">DKP<span class="dkp-sort-arrow">${sortArrow("balance")}</span></th>
      </tr></thead>
      <tbody>${filtered.map((b,i)=>{
        const balCls=b.balance>0?"dkp-pos":b.balance<0?"dkp-neg":"dkp-zero";
        const clr=cc(b.className);
        return`<tr onclick="showDkpPlayerDetail('${h(b.playerName).replace(/'/g,"\\'")}')">
          <td class="dkp-rank">${i+1}</td>
          <td style="font-weight:600;color:${clr}">${h(b.playerName)}</td>
          <td style="font-size:12px;color:var(--tx3)">${b.className?h(b.className):"—"}</td>
          <td style="text-align:right"><span class="dkp-bal ${balCls}">${b.balance>0?"+":""}${b.balance}</span></td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;
  }
  html+=`</div>`;

  // Recent transactions with filter
  if(dkpTransactions.length){
    html+=`<div class="card"><div class="card-t">Letzte Transaktionen</div>`;
    html+=`<div class="dkp-tx-filters">
      <button class="dkp-tx-filter${dkpTxFilter==="all"?" active":""}" onclick="dkpTxFilter='all';renderDkp()">Alle</button>
      <button class="dkp-tx-filter${dkpTxFilter==="earn"?" active":""}" onclick="dkpTxFilter='earn';renderDkp()">Verdient</button>
      <button class="dkp-tx-filter${dkpTxFilter==="spend"?" active":""}" onclick="dkpTxFilter='spend';renderDkp()">Beute</button>
      <button class="dkp-tx-filter${dkpTxFilter==="decay"?" active":""}" onclick="dkpTxFilter='decay';renderDkp()">Verfall</button>
      <button class="dkp-tx-filter${dkpTxFilter==="adjust"?" active":""}" onclick="dkpTxFilter='adjust';renderDkp()">Anpassung</button>
    </div>`;
    const filteredTx=dkpTxFilter==="all"?dkpTransactions:dkpTransactions.filter(t=>t.type===dkpTxFilter);
    html+=renderDkpTxList(filteredTx.slice(0,20));
    if(!filteredTx.length)html+=`<div class="empty" style="padding:12px 0">Keine Transaktionen in dieser Kategorie.</div>`;
    html+=`</div>`;
  }

  return html;
}

function renderDkpTxList(txList,showActions){
  const admin=showActions!==false&&isDkpAdmin();
  return txList.map(tx=>{
    const typeCls=tx.type==="earn"?"dkp-tx-earn":tx.type==="spend"?"dkp-tx-spend":tx.type==="adjust"?"dkp-tx-adjust":"dkp-tx-decay";
    const typeLabel=tx.type==="earn"?"Verdient":tx.type==="spend"?"Beute":tx.type==="adjust"?"Anpassung":"Verfall";
    const amtCls=tx.amount>0?"dkp-pos":tx.amount<0?"dkp-neg":"dkp-zero";
    const amtStr=tx.amount>0?"+"+tx.amount:String(tx.amount);
    const clr=cc(dkpBalances.find(b=>b.playerName===tx.playerName)?.className);
    const date=new Date(tx.timestamp);
    const dateStr=String(date.getDate()).padStart(2,"0")+"."+String(date.getMonth()+1).padStart(2,"0")+". "+String(date.getHours()).padStart(2,"0")+":"+String(date.getMinutes()).padStart(2,"0");
    const edited=tx.editedAt?` <span class="dkp-tx-edited">(bearbeitet)</span>`:"";
    return`<div class="dkp-tx">
      <span class="dkp-tx-type ${typeCls}">${typeLabel}</span>
      <span class="dkp-tx-name" style="color:${clr}">${h(tx.playerName)}</span>
      <span class="dkp-tx-reason">${tx.type==="spend"?linkItems(tx.reason):h(tx.reason)}${edited}</span>
      <span class="dkp-tx-amount ${amtCls}">${amtStr}</span>
      <span class="dkp-tx-meta">${h(tx.createdBy||"")} · ${dateStr}</span>
      ${admin?`<span class="dkp-tx-actions">
        <button class="dkp-tx-btn" onclick="event.stopPropagation();dkpEditTx('${tx.id}')">✎</button>
        <button class="dkp-tx-btn dkp-tx-del" onclick="event.stopPropagation();dkpDeleteTx('${tx.id}')">✕</button>
      </span>`:""}
    </div>`;
  }).join("");
}

function renderDkpPlayerDetail(){
  const bal=dkpBalances.find(b=>b.playerName===dkpPlayerDetail);
  if(!bal)return`<div class="card"><div class="empty">Spieler nicht gefunden</div></div>`;
  const clr=cc(bal.className);
  const balCls=bal.balance>0?"dkp-pos":bal.balance<0?"dkp-neg":"dkp-zero";
  const earned=dkpPlayerTx.filter(t=>t.type==="earn").reduce((s,t)=>s+t.amount,0);
  const spent=dkpPlayerTx.filter(t=>t.type==="spend").reduce((s,t)=>s+Math.abs(t.amount),0);
  const decayed=dkpPlayerTx.filter(t=>t.type==="decay").reduce((s,t)=>s+Math.abs(t.amount),0);
  const adjusted=dkpPlayerTx.filter(t=>t.type==="adjust").reduce((s,t)=>s+t.amount,0);
  const admin=isDkpAdmin();

  let html=`<div class="card dkp-player-detail">
    <div class="dkp-detail-header">
      <div>
        <div class="dkp-detail-name" style="color:${clr}">${h(bal.playerName)}</div>
        <div class="dkp-detail-class">${bal.className?h(bal.className):""}</div>
      </div>
      <div class="dkp-detail-bal ${balCls}">${bal.balance>0?"+":""}${bal.balance} DKP</div>
      <button class="dkp-detail-close" onclick="dkpPlayerDetail=null;renderDkp()">✕</button>
    </div>
    <div class="dkp-detail-stats">
      <div class="dkp-detail-stat"><strong style="color:var(--grn)">+${earned}</strong>Verdient</div>
      <div class="dkp-detail-stat"><strong style="color:var(--dps)">−${spent}</strong>Beute</div>
      <div class="dkp-detail-stat"><strong style="color:var(--ylw)">−${decayed}</strong>Verfall</div>
      ${adjusted?`<div class="dkp-detail-stat"><strong style="color:var(--gold)">${adjusted>0?"+":""}${adjusted}</strong>Anpassung</div>`:""}
      <div class="dkp-detail-stat"><strong>${dkpPlayerTx.length}</strong>Transaktionen</div>
    </div>`;

  // Admin player management actions
  if(admin){
    const eName=h(bal.playerName).replace(/'/g,"\\'");
    html+=`<div class="dkp-detail-actions">
      <button class="dkp-detail-action" onclick="dkpAdjustBalance('${eName}',${bal.balance})">DKP anpassen</button>
      <button class="dkp-detail-action" onclick="dkpEditPlayer('${eName}','${h(bal.className||"").replace(/'/g,"\\'")}')">Bearbeiten</button>
      <button class="dkp-detail-action danger" onclick="dkpDeletePlayer('${eName}')">Spieler löschen</button>
    </div>`;
  }

  if(dkpPlayerTx.length){
    // Transaction type filter
    html+=`<div class="card-t" style="margin-bottom:8px">Alle Transaktionen</div>`;
    html+=`<div class="dkp-tx-filters">
      <button class="dkp-tx-filter${dkpTxFilter==="all"?" active":""}" onclick="dkpTxFilter='all';renderDkp()">Alle</button>
      <button class="dkp-tx-filter${dkpTxFilter==="earn"?" active":""}" onclick="dkpTxFilter='earn';renderDkp()">Verdient</button>
      <button class="dkp-tx-filter${dkpTxFilter==="spend"?" active":""}" onclick="dkpTxFilter='spend';renderDkp()">Beute</button>
      <button class="dkp-tx-filter${dkpTxFilter==="decay"?" active":""}" onclick="dkpTxFilter='decay';renderDkp()">Verfall</button>
      <button class="dkp-tx-filter${dkpTxFilter==="adjust"?" active":""}" onclick="dkpTxFilter='adjust';renderDkp()">Anpassung</button>
    </div>`;
    const filteredPlayerTx=dkpTxFilter==="all"?dkpPlayerTx:dkpPlayerTx.filter(t=>t.type===dkpTxFilter);
    if(filteredPlayerTx.length){
      html+=renderDkpTxList(filteredPlayerTx);
    }else{
      html+=`<div class="empty" style="padding:12px 0">Keine Transaktionen in dieser Kategorie.</div>`;
    }
  }else{
    html+=`<div class="empty">Keine Transaktionen</div>`;
  }

  html+=`</div>`;
  return html;
}

  let html=`<div class="card dkp-form" style="padding:28px">
    <div class="card-t">Wöchentlicher Verfall</div>
    <p style="font-size:13px;color:var(--tx3);margin-bottom:16px">Reduziert alle positiven DKP-Stände um einen Prozentsatz. Empfohlen: 10–20% pro Woche.</p>

      <span class="lbl">Verfall-Prozent</span>
      <input type="number" id="dkp-decay-pct" value="${dkpDecayPercent}" placeholder="z.B. 15" min="1" max="100" oninput="dkpDecayPercent=Number(this.value)||15;renderDkp()">

window.saveDkpConfig=async function(){
  const defaultDecayPercent=Number(document.getElementById("cfg-decay").value);
  const maxDkpAmount=Number(document.getElementById("cfg-max").value);

  const allowNegativeBalance=document.getElementById("cfg-neg").value==="true";
  const transactionLimit=Number(document.getElementById("cfg-txlimit").value);
  const reasonMaxLength=Number(document.getElementById("cfg-reasonlen").value);

// ── CSV Export ──
window.exportDkpCsv=function(){
  function csvVal(str){str=String(str);if(str.includes('"')||str.includes(',')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';return str}

  // Standings CSV
  let csv="Rang,Spieler,Klasse,DKP,Zuletzt aktualisiert\n";
  const sorted=dkpSortedBalances();
  sorted.forEach((b,i)=>{
    const date=b.lastUpdated?new Date(b.lastUpdated).toLocaleDateString("de-DE"):"";
    csv+=[i+1,csvVal(b.playerName),csvVal(b.className||""),b.balance,date].join(",")+"\n";
  });
  csv+="\n\nTransaktionen\nDatum,Spieler,Typ,Betrag,Grund,Von\n";
  dkpTransactions.forEach(tx=>{
    const date=new Date(tx.timestamp).toLocaleString("de-DE");
    const type=tx.type==="earn"?"Verdient":tx.type==="spend"?"Beute":"Verfall";
    csv+=[csvVal(date),csvVal(tx.playerName),type,tx.amount,csvVal(tx.reason),csvVal(tx.createdBy||"")].join(",")+"\n";
  });

  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="dkp-export-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
};

window.dkpShowMyDkp=async function(){
  if(!currentUser)return;
  // Try to find the player by matching username to DKP balance or roster entry
  const uLower=currentUser.username.toLowerCase();
  const uPrefix=uLower.split("#")[0];
  let match=dkpBalances.find(b=>{
    const lower=b.playerName.toLowerCase();
    return lower===uLower||lower===uPrefix;
  });
  if(!match){
    // Try matching via roster entries linked to this userId
    const myEntry=entries.find(e=>e.userId===currentUser.userId);
    if(myEntry)match=dkpBalances.find(b=>b.playerName===myEntry.charName);
  }
  if(match){
    dkpView="overview";dkpTxFilter="all";
    showDkpPlayerDetail(match.playerName);
  }else{
    toast("Kein DKP-Eintrag für deinen Account gefunden");
  }
};

function isAdminUser(){
  if(!currentUser)return false;
  if(currentUser.isAdmin)return true;
  if(!dkpConfig.roles)return false;
  const lower=currentUser.username.toLowerCase();
  const role=dkpConfig.roles[lower];
  if(role)return role==="admin";
  const prefix=lower.split("#")[0];
  if(prefix!==lower&&dkpConfig.roles[prefix])return dkpConfig.roles[prefix]==="admin";
  return false;
}

function isOfficerUser(){
  if(isAdminUser())return true;
  if(!currentUser||!dkpConfig.roles)return false;
  const lower=currentUser.username.toLowerCase();
  const role=dkpConfig.roles[lower];
  if(role)return role==="admin"||role==="officer";
  const prefix=lower.split("#")[0];
  if(prefix!==lower&&dkpConfig.roles[prefix]){const r=dkpConfig.roles[prefix];return r==="admin"||r==="officer"}
  return false;
}

// Kara group planner constants (reuses KARA_TANKS/KARA_HEALERS/KARA_DPS/KARA_SIZE from above)
const KARA_GROUPS_COUNT=3;
const LINK_COLORS=["#e57373","#64b5f6","#81c784","#ffb74d","#ce93d8","#4dd0e1","#fff176","#a1887f"];

// Kara state
let karaWeekOffset=0; // 0 = current ID week, -1 = last week, +1 = next week
let karaGroups=[[],[],[]]; // 3 arrays of {entryId, pinned}
let karaLinks=[]; // [{ids:[entryId,entryId,...], color}]
let karaFilterDay="", karaFilterTime="";
let karaDragEntryId=null;

// ── ID Week helpers (Wed 03:00 → Tue 02:59) ──
function getIdWeekStart(offset){
  const now=new Date();
  // Find current Wednesday: day 0=Sun, 3=Wed
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),3,0,0);
  const dow=d.getDay(); // 0=Sun
  // Days since last Wednesday
  const daysSinceWed=(dow+4)%7; // Wed=0, Thu=1, ..., Tue=6
  d.setDate(d.getDate()-daysSinceWed);
  // If we're before Wednesday 3:00 AM this week, we're still in last week's ID
  if(now<d) d.setDate(d.getDate()-7);
  // Apply offset
  d.setDate(d.getDate()+offset*7);
  return d;
}
function getIdWeekEnd(start){
  const end=new Date(start);
  end.setDate(end.getDate()+6);
  return end;
}
function formatDate(d){
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function karaWeekKey(offset){
  const s=getIdWeekStart(offset);
  return 'kara_'+s.getFullYear()+'_'+String(s.getMonth()+1).padStart(2,'0')+'_'+String(s.getDate()).padStart(2,'0');
}

// ── Persistence (localStorage) ──
function saveKaraState(){
  const key=karaWeekKey(karaWeekOffset);
  const data={groups:karaGroups,links:karaLinks};
  localStorage.setItem(key,JSON.stringify(data));
}
function loadKaraState(){
  const key=karaWeekKey(karaWeekOffset);
  const raw=localStorage.getItem(key);
  if(raw){
    try{
      const data=JSON.parse(raw);
      karaGroups=data.groups||[[],[],[]];
      karaLinks=data.links||[];
      // Ensure 3 groups exist
      while(karaGroups.length<KARA_GROUPS_COUNT)karaGroups.push([]);
    }catch(e){karaGroups=[[],[],[]];karaLinks=[];}
  }else{
    karaGroups=[[],[],[]];
    karaLinks=[];
  }
  // Prune entries that no longer exist in the roster
  const validIds=new Set(entries.map(e=>e.id));
  karaGroups.forEach((g,gi)=>{
    karaGroups[gi]=g.filter(p=>validIds.has(p.entryId));
  });
  karaLinks=karaLinks.filter(lk=>lk.ids.every(id=>validIds.has(id)));
}

// ── Pool: entries not assigned to any group ──
function karaAssignedIds(){
  const s=new Set();
  karaGroups.forEach(g=>g.forEach(p=>s.add(p.entryId)));
  return s;
}
function karaPool(){
  const assigned=karaAssignedIds();
  let pool=entries.filter(e=>!assigned.has(e.id));
  // Apply optional day/time filter
  if(karaFilterDay){
    pool=pool.filter(e=>{
      if(!e.availability)return false;
      if(karaFilterTime){
        // Check if available at specific hour (all 4 quarters)
        const qs=hourQuarters(karaFilterTime).map(q=>karaFilterDay+'_'+q);
        return qs.every(q=>e.availability[q]==='yes'||e.availability[q]===true||e.availability[q]==='tentative');
      }
      // Any availability on this day
      return SLOTS.some(s=>e.availability[karaFilterDay+'_'+s]);
    });
  }
  return pool;
}

// ── Role counting for a group ──
function karaGroupRoles(group){
  let t=0,hl=0,dp=0;
  group.forEach(p=>{
    const entry=entries.find(e=>e.id===p.entryId);
    if(!entry)return;
    const roles=entry.roles||[];
    if(roles.includes("Tank"))t++;
    if(roles.includes("Heiler"))hl++;
    if(roles.includes("DPS"))dp++;
  });
  return{t,hl,dp};
}

// ── Link helpers ──
function getEntryLinkColor(entryId){
  const lk=karaLinks.find(l=>l.ids.includes(entryId));
  return lk?lk.color:null;
}
function getEntryLinkGroup(entryId){
  return karaLinks.find(l=>l.ids.includes(entryId))||null;
}
function nextLinkColor(){
  const used=new Set(karaLinks.map(l=>l.color));
  return LINK_COLORS.find(c=>!used.has(c))||LINK_COLORS[karaLinks.length%LINK_COLORS.length];
}

// ── Player card HTML ──
function karaPlayerHtml(entryId,inGroup,pinned){
  const entry=entries.find(e=>e.id===entryId);
  if(!entry)return'';
  const roles=entry.roles||[];
  const specs=entry.specs||[];
  const linkColor=getEntryLinkColor(entryId);
  const linkGroup=getEntryLinkGroup(entryId);
  const pinnedCls=pinned?'pinned':'';
  const linkedCls=linkColor?'linked':'';
  const linkedStyle=linkColor?`border-left-color:${linkColor}`:'';
  // Primary role badge
  const mainRole=roles[0]||'DPS';
  const roleColor=RC[mainRole]||'#888';
  // Spec text
  const specText=specs.length?specs[0]:'';
  let html=`<div class="kara-player ${pinnedCls} ${linkedCls}" draggable="true" data-entry-id="${entryId}" style="${linkedStyle}">`;
  html+=`<img class="wow-ico-sm" src="${clsIcon(entry.className)}" alt="${h(entry.className)}">`;
  html+=`<span class="kp-name" style="color:${cc(entry.className)}">${h(entry.charName)}</span>`;
  if(specText) html+=`<span class="kp-spec">${h(specText)}</span>`;
  html+=`<span class="kp-role" style="background:${roleColor}22;color:${roleColor}">${mainRole}</span>`;
  if(linkGroup){
    html+=`<span class="kara-link-badge" style="background:${linkColor}33;color:${linkColor}">L</span>`;
  }
  html+=`<span class="kp-actions">`;
  if(inGroup){
    html+=`<button class="kp-btn kp-pin" title="${pinned?'Lösen':'Fixieren'}" data-pin="${entryId}">${pinned?'\u{1F4CC}':'\u{1F4CD}'}</button>`;
    html+=`<button class="kp-btn" title="Zurück zum Pool" data-unassign="${entryId}">\u2716</button>`;
  }
  html+=`<button class="kp-btn" title="Verknüpfen" data-link="${entryId}">\u{1F517}</button>`;
  html+=`</span>`;
  html+=`</div>`;
  return html;
}

// ══════════════════════════════
//  RENDER KARA
// ══════════════════════════════
function renderKara(){
  const el=document.getElementById("v-kara");
  loadKaraState();
  const weekStart=getIdWeekStart(karaWeekOffset);
  const weekEnd=getIdWeekEnd(weekStart);
  const pool=karaPool();

  // Week navigation
  let html=`<div class="kara-header">
    <div class="kara-week-nav">
      <button onclick="karaWeekOffset--;renderKara()">\u25C0</button>
      <div class="kara-week-label">
        ID-Woche
        <small>${formatDate(weekStart)} \u2013 ${formatDate(weekEnd)}</small>
      </div>
      <button onclick="karaWeekOffset++;renderKara()">\u25B6</button>
    </div>
    <div class="kara-actions">
      <button class="kara-btn primary" onclick="karaAutoGenerate()" title="Verbleibende Slots optimal füllen">\u2728 Auto-Verteilen</button>
      <button class="kara-btn danger" onclick="karaReset()" title="Alle Zuweisungen zurücksetzen">\u21BA Zurücksetzen</button>
    </div>
  </div>`;

  // Optional filter
  html+=`<div class="kara-filter"><div class="kara-filter-row">
    <span>Filter:</span>
    <select onchange="karaFilterDay=this.value;karaFilterTime='';renderKara()">
      <option value="">Alle Spieler</option>
      ${DAYS.map(d=>`<option value="${d}"${karaFilterDay===d?' selected':''}>${d}</option>`).join('')}
    </select>`;
  if(karaFilterDay){
    html+=`<select onchange="karaFilterTime=this.value;renderKara()">
      <option value="">Jede Uhrzeit</option>
      ${HOUR_LABELS.map(hl=>`<option value="${hl}"${karaFilterTime===hl?' selected':''}>${hl}:00</option>`).join('')}
    </select>`;
  }
  html+=`</div></div>`;

  // Layout: pool + 3 groups
  html+=`<div class="kara-layout">`;

  // Pool
  html+=`<div class="kara-pool">
    <div class="kara-pool-title">Spieler-Pool <span class="kara-pool-count">${pool.length}</span></div>
    <div class="kara-dropzone pool-zone" data-kara-drop="pool">`;
  if(pool.length===0){
    html+=`<div class="kara-empty">${entries.length===0?'Keine Einträge vorhanden':'Alle Spieler sind verteilt'}</div>`;
  } else {
    pool.forEach(e=>{
      html+=karaPlayerHtml(e.id,false,false);
    });
  }
  html+=`</div></div>`;

  // 3 Kara groups
  for(let gi=0;gi<KARA_GROUPS_COUNT;gi++){
    const group=karaGroups[gi]||[];
    const roles=karaGroupRoles(group);
    const full=group.length>=10;

    html+=`<div class="kara-group">
      <div class="kara-group-hdr">
        <div class="kara-group-title">Karazhan ${gi+1} <span class="kara-group-count">${group.length}/10</span></div>
      </div>
      <div class="kara-role-bar">
        <span class="kara-role-tag ${roles.t>=KARA_TANKS?'ok':'need'}" style="background:var(--tank)22;color:var(--tank)">\u{1F6E1}\uFE0F ${roles.t}/${KARA_TANKS}T</span>
        <span class="kara-role-tag ${roles.hl>=KARA_HEALERS?'ok':'need'}" style="background:var(--heal)22;color:var(--heal)">\u{1F49A} ${roles.hl}/${KARA_HEALERS}H</span>
        <span class="kara-role-tag ${roles.dp>=KARA_DPS?'ok':'need'}" style="background:var(--dps)22;color:var(--dps)">\u2694\uFE0F ${roles.dp}/${KARA_DPS}D</span>
      </div>
      <div class="kara-dropzone" data-kara-drop="group-${gi}">`;
    if(group.length===0){
      html+=`<div class="kara-empty">Spieler hierher ziehen</div>`;
    } else {
      group.forEach(p=>{
        html+=karaPlayerHtml(p.entryId,true,p.pinned);
      });
    }
    html+=`</div></div>`;
  }

  html+=`</div>`; // close kara-layout

  // Summary
  const totalAssigned=karaGroups.reduce((s,g)=>s+g.length,0);
  html+=`<div class="kara-comp-summary">
    <div class="kara-comp-card"><div class="num">${totalAssigned}</div><div class="lbl">Verteilt</div></div>
    <div class="kara-comp-card"><div class="num">${pool.length}</div><div class="lbl">Pool</div></div>
    <div class="kara-comp-card"><div class="num">${karaLinks.length}</div><div class="lbl">Links</div></div>
  </div>`;

  el.innerHTML=html;

  // Attach drag & drop handlers
  karaInitDragDrop();
}

// ══════════════════════════════
//  DRAG & DROP
// ══════════════════════════════
function karaInitDragDrop(){
  const karaEl=document.getElementById("v-kara");

  // Drag start
  karaEl.querySelectorAll('.kara-player[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      karaDragEntryId=card.dataset.entryId;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',card.dataset.entryId);
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      karaDragEntryId=null;
      karaEl.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));
    });
  });

  // Drop zones
  karaEl.querySelectorAll('.kara-dropzone').forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave',e=>{
      if(!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop',e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const entryId=e.dataTransfer.getData('text/plain');
      if(!entryId)return;
      const target=zone.dataset.karaDrop;
      karaMoveEntry(entryId,target);
    });
  });

  // Button handlers (pin, unassign, link) via event delegation
  karaEl.addEventListener('click',function(ev){
    const pinBtn=ev.target.closest('[data-pin]');
    if(pinBtn){karaTogglePin(pinBtn.dataset.pin);return}
    const unBtn=ev.target.closest('[data-unassign]');
    if(unBtn){karaMoveEntry(unBtn.dataset.unassign,'pool');return}
    const lkBtn=ev.target.closest('[data-link]');
    if(lkBtn){karaStartLink(lkBtn.dataset.link);return}
  });
}

function karaMoveEntry(entryId,target){
  // Remove from current location
  karaGroups.forEach((g,gi)=>{
    karaGroups[gi]=g.filter(p=>p.entryId!==entryId);
  });

  if(target==='pool'){
    // Just remove from groups, it goes back to pool
  }else if(target.startsWith('group-')){
    const gi=parseInt(target.split('-')[1]);
    if(karaGroups[gi].length>=10){toast('Gruppe ist voll (10/10)');saveKaraState();renderKara();return}
    // Find if the entry was pinned
    const wasPinned=false; // freshly moved entries are unpinned
    karaGroups[gi].push({entryId,pinned:wasPinned});

    // Move linked players together
    const link=getEntryLinkGroup(entryId);
    if(link){
      link.ids.forEach(lid=>{
        if(lid===entryId)return;
        // Remove linked player from all groups
        let alreadyInTarget=false;
        karaGroups.forEach((g,gj)=>{
          const idx=g.findIndex(p=>p.entryId===lid);
          if(idx>=0){
            if(gj===gi){alreadyInTarget=true;return}
            g.splice(idx,1);
          }
        });
        if(!alreadyInTarget&&karaGroups[gi].length<10){
          karaGroups[gi].push({entryId:lid,pinned:false});
        }
      });
    }
  }
  saveKaraState();
  renderKara();
}

function karaTogglePin(entryId){
  karaGroups.forEach(g=>{
    g.forEach(p=>{
      if(p.entryId===entryId) p.pinned=!p.pinned;
    });
  });
  saveKaraState();
  renderKara();
}

// ── Linking system ──
let karaLinkPending=null; // first click stores entryId here

function karaStartLink(entryId){
  const existingLink=getEntryLinkGroup(entryId);

  if(existingLink){
    // Already linked — show options: unlink or add to link
    if(karaLinkPending&&karaLinkPending!==entryId){
      // Merge into existing link
      const pendingLink=getEntryLinkGroup(karaLinkPending);
      if(pendingLink&&pendingLink===existingLink){
        // Same link, just cancel
        karaLinkPending=null;
        toast('Bereits verknüpft');
        return;
      }
      if(pendingLink){
        // Merge two link groups
        pendingLink.ids.forEach(id=>{
          if(!existingLink.ids.includes(id))existingLink.ids.push(id);
        });
        karaLinks=karaLinks.filter(l=>l!==pendingLink);
      }else{
        if(!existingLink.ids.includes(karaLinkPending))existingLink.ids.push(karaLinkPending);
      }
      karaLinkPending=null;
      saveKaraState();
      renderKara();
      toast('Verknüpft');
      return;
    }
    // Remove from link
    existingLink.ids=existingLink.ids.filter(id=>id!==entryId);
    if(existingLink.ids.length<2) karaLinks=karaLinks.filter(l=>l!==existingLink);
    karaLinkPending=null;
    saveKaraState();
    renderKara();
    toast('Verknüpfung gelöst');
    return;
  }

  if(karaLinkPending===null){
    // First click
    karaLinkPending=entryId;
    toast('Klicke einen zweiten Spieler zum Verknüpfen');
    return;
  }

  if(karaLinkPending===entryId){
    karaLinkPending=null;
    toast('Verknüpfung abgebrochen');
    return;
  }

  // Second click — create link
  const pendingLink=getEntryLinkGroup(karaLinkPending);
  if(pendingLink){
    // Add to existing link
    pendingLink.ids.push(entryId);
  }else{
    karaLinks.push({ids:[karaLinkPending,entryId],color:nextLinkColor()});
  }
  karaLinkPending=null;
  saveKaraState();
  renderKara();
  toast('Spieler verknüpft');
}

// ══════════════════════════════
//  AUTO-GENERATE ALGORITHM
// ══════════════════════════════
function karaAutoGenerate(){
  loadKaraState();

  // Collect pool entries (not assigned or not pinned-assigned)
  const assigned=karaAssignedIds();
  const pinnedIds=new Set();
  karaGroups.forEach(g=>g.forEach(p=>{if(p.pinned)pinnedIds.add(p.entryId)}));

  // Remove non-pinned entries from groups (they'll be reassigned)
  karaGroups.forEach((g,gi)=>{
    karaGroups[gi]=g.filter(p=>p.pinned);
  });

  // Build list of available players (all entries minus pinned ones)
  let available=entries.filter(e=>!pinnedIds.has(e.id));

  // Apply day/time filter if set
  if(karaFilterDay){
    available=available.filter(e=>{
      if(!e.availability)return false;
      if(karaFilterTime){
        const qs=hourQuarters(karaFilterTime).map(q=>karaFilterDay+'_'+q);
        return qs.every(q=>e.availability[q]==='yes'||e.availability[q]===true||e.availability[q]==='tentative');
      }
      return SLOTS.some(s=>e.availability[karaFilterDay+'_'+s]);
    });
  }

  // Respect links: group linked players together
  const linkedSets=karaLinks.map(lk=>({ids:lk.ids.filter(id=>!pinnedIds.has(id)),color:lk.color}));

  // Classify available players by primary role
  function primaryRole(entry){
    const roles=entry.roles||[];
    if(roles.includes('Tank'))return'Tank';
    if(roles.includes('Heiler'))return'Heiler';
    return'DPS';
  }

  const tanks=available.filter(e=>primaryRole(e)==='Tank');
  const healers=available.filter(e=>primaryRole(e)==='Heiler');
  const dps=available.filter(e=>primaryRole(e)==='DPS');

  // Score a group's composition
  function groupScore(group){
    const roles=karaGroupRoles(group);
    let score=0;
    // Penalize missing roles
    score-=Math.max(0,KARA_TANKS-roles.t)*10;
    score-=Math.max(0,KARA_HEALERS-roles.hl)*10;
    score-=Math.max(0,KARA_DPS-roles.dp)*8;
    // Penalize excess
    score-=Math.max(0,roles.t-KARA_TANKS)*3;
    score-=Math.max(0,roles.hl-KARA_HEALERS)*3;
    // Bonus for class diversity
    const classes=new Set();
    group.forEach(p=>{
      const entry=entries.find(e=>e.id===p.entryId);
      if(entry)classes.add(entry.className);
    });
    score+=classes.size*2;
    return score;
  }

  // Find which group needs a role most
  function needsRole(role){
    let bestGi=-1,bestNeed=0;
    for(let gi=0;gi<KARA_GROUPS_COUNT;gi++){
      if(karaGroups[gi].length>=10)continue;
      const roles=karaGroupRoles(karaGroups[gi]);
      let need=0;
      if(role==='Tank')need=Math.max(0,KARA_TANKS-roles.t);
      if(role==='Heiler')need=Math.max(0,KARA_HEALERS-roles.hl);
      if(role==='DPS')need=Math.max(0,KARA_DPS-roles.dp);
      if(need>bestNeed||(need===bestNeed&&karaGroups[gi].length<(bestGi>=0?karaGroups[bestGi].length:99))){
        bestNeed=need;bestGi=gi;
      }
    }
    return bestGi;
  }

  // Find smallest group that has capacity
  function smallestGroup(){
    let bestGi=-1,bestSize=99;
    for(let gi=0;gi<KARA_GROUPS_COUNT;gi++){
      if(karaGroups[gi].length>=10)continue;
      if(karaGroups[gi].length<bestSize){bestSize=karaGroups[gi].length;bestGi=gi}
    }
    return bestGi;
  }

  // First: place linked sets together
  const placed=new Set();
  linkedSets.forEach(ls=>{
    if(ls.ids.length===0)return;
    // Check if any linked player is already pinned in a group
    let targetGi=-1;
    for(let gi=0;gi<KARA_GROUPS_COUNT;gi++){
      if(karaGroups[gi].some(p=>ls.ids.includes(p.entryId))){targetGi=gi;break}
    }
    if(targetGi<0) targetGi=smallestGroup();
    if(targetGi<0) return;
    ls.ids.forEach(id=>{
      if(placed.has(id))return;
      if(karaGroups[targetGi].length>=10)return;
      if(karaGroups[targetGi].some(p=>p.entryId===id))return;
      karaGroups[targetGi].push({entryId:id,pinned:false});
      placed.add(id);
    });
  });

  // Then: fill tanks, healers, DPS in priority order
  function assignRole(players,role){
    // Shuffle for fairness
    const shuffled=[...players].sort(()=>Math.random()-.5);
    shuffled.forEach(entry=>{
      if(placed.has(entry.id))return;
      const gi=needsRole(role);
      if(gi<0)return;
      if(karaGroups[gi].length>=10)return;
      karaGroups[gi].push({entryId:entry.id,pinned:false});
      placed.add(entry.id);
    });
  }

  assignRole(tanks,'Tank');
  assignRole(healers,'Heiler');
  assignRole(dps,'DPS');

  // Fill remaining spots with any unplaced players (prefer class diversity)
  const unplaced=available.filter(e=>!placed.has(e.id));
  unplaced.sort(()=>Math.random()-.5);
  unplaced.forEach(entry=>{
    // Find group with fewest players that has <10
    const gi=smallestGroup();
    if(gi<0)return;
    karaGroups[gi].push({entryId:entry.id,pinned:false});
    placed.add(entry.id);
  });

  // Optimize: swap players between groups to improve composition scores
  for(let iter=0;iter<50;iter++){
    let improved=false;
    for(let gi=0;gi<KARA_GROUPS_COUNT;gi++){
      for(let gj=gi+1;gj<KARA_GROUPS_COUNT;gj++){
        for(let pi=0;pi<karaGroups[gi].length;pi++){
          if(karaGroups[gi][pi].pinned)continue;
          const eiLink=getEntryLinkGroup(karaGroups[gi][pi].entryId);
          for(let pj=0;pj<karaGroups[gj].length;pj++){
            if(karaGroups[gj][pj].pinned)continue;
            const ejLink=getEntryLinkGroup(karaGroups[gj][pj].entryId);
            // Don't break links
            if(eiLink&&eiLink.ids.some(id=>karaGroups[gi].some(p=>p.entryId===id&&p.entryId!==karaGroups[gi][pi].entryId)))continue;
            if(ejLink&&ejLink.ids.some(id=>karaGroups[gj].some(p=>p.entryId===id&&p.entryId!==karaGroups[gj][pj].entryId)))continue;

            const scoreBefore=groupScore(karaGroups[gi])+groupScore(karaGroups[gj]);
            // Swap
            const tmp=karaGroups[gi][pi];
            karaGroups[gi][pi]=karaGroups[gj][pj];
            karaGroups[gj][pj]=tmp;
            const scoreAfter=groupScore(karaGroups[gi])+groupScore(karaGroups[gj]);
            if(scoreAfter>scoreBefore){
              improved=true;
            }else{
              // Undo swap
              karaGroups[gj][pj]=karaGroups[gi][pi];
              karaGroups[gi][pi]=tmp;
            }
          }
        }
      }
    }
    if(!improved)break;
  }

  saveKaraState();
  renderKara();
  toast('Gruppen automatisch verteilt');
}

window.karaAutoGenerate=karaAutoGenerate;

function karaReset(){
  showModal('Gruppen zurücksetzen','Alle Zuweisungen und Verknüpfungen für diese ID-Woche werden gelöscht.',()=>{
    karaGroups=[[],[],[]];
    karaLinks=[];
    saveKaraState();
    renderKara();
    toast('Gruppen zurückgesetzt');
  });
}
window.karaReset=karaReset;

// ══════════════════════════════
//  CSV EXPORT
// ══════════════════════════════
window.exportCSV=function(){
  function csvVal(str){
    str=String(str);
    if(str.includes('"')||str.includes(',')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';
    return str;
  }

  // One column per day showing collapsed time ranges
  const header=["Charakter","Klasse","Rollen",...DAYS.map(d=>DS[d]),"Anmerkungen"];
  const rows=[header.map(csvVal).join(",")];

  entries.forEach(e=>{
    const roles=(e.roles||[]).join(", ");
    const cols=[e.charName,e.className,roles];
    DAYS.forEach(d=>{
      const ranges=collapseRanges(e.availability||{},d);
      if(!ranges.length){cols.push("—");return}
      const parts=ranges.map(r=>{
        const prefix=r.type==="tentative"?"? ":"";
        return prefix+r.start+"\u2013"+r.end;
      });
      cols.push(parts.join(", "));
    });
    cols.push(e.notes||"");
    rows.push(cols.map(csvVal).join(","));
  });

  const bom="\uFEFF";
  const blob=new Blob([bom+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="raid-verfuegbarkeit.csv";
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exportiert \u2713");
};
