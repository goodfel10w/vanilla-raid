<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&lt;Vanilla&gt; Raid-Planer — TBC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a84c;--gold-l:#f0d878;--gold-d:#a8873a;
  --bg:#0a0a12;--bg2:#12101f;
  --card:rgba(255,255,255,0.025);--bdr:rgba(255,255,255,0.06);
  --tx:#e0ddd4;--tx2:#8a8098;--tx3:#6a6278;--tx4:#5a5268;--tx5:#3a3548;
  --tank:#5b9bd5;--heal:#66bb6a;--dps:#e57373;
  --grn:#66bb6a;--grn-bg:rgba(76,175,80,0.15);--grn-bd:rgba(76,175,80,0.4);
  --ylw:#e5c244;--ylw-bg:rgba(229,194,68,0.15);--ylw-bd:rgba(229,194,68,0.4);
}
body{
  min-height:100vh;color:var(--tx);font-family:'Nunito Sans',system-ui,sans-serif;
  background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 40%,#1a1028 70%,#0d0b16 100%);
}
.glow{position:fixed;pointer-events:none}
.g1{top:-30%;left:-10%;width:50%;height:60%;background:radial-gradient(ellipse,rgba(80,40,120,.08),transparent 70%)}
.g2{bottom:-20%;right:-10%;width:40%;height:50%;background:radial-gradient(ellipse,rgba(40,60,120,.06),transparent 70%)}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px;position:relative;z-index:1}
.center{text-align:center}

/* Header */
.guild{font-size:11px;letter-spacing:6px;text-transform:uppercase;color:#7a6f8a;margin-bottom:4px}
h1{font-family:'Cinzel',serif;font-size:34px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-l),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.sub{color:var(--tx3);font-size:12px;margin-top:4px;font-style:italic}
.cnt{color:var(--tx3);font-size:13px;margin-top:6px;transition:opacity .3s}

/* Tabs */
.tabs{display:flex;gap:4px;margin:0 auto 28px;justify-content:center;flex-wrap:wrap}
.tab{padding:9px 20px;border:none;border-radius:6px;cursor:pointer;font:600 13px 'Nunito Sans',sans-serif;letter-spacing:.5px;transition:all .2s;background:rgba(255,255,255,.04);color:var(--tx2)}
.tab:hover{background:rgba(255,255,255,.07)}
.tab.on{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--bg)}

/* Card */
.card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:20px;margin-bottom:12px}
.card-t{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}

/* Form fields */
.lbl{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:2px;display:block;margin-bottom:8px}
.lbl-s{font-size:11px;color:var(--tx4);display:block;margin-bottom:8px}
.fld{margin-bottom:18px}
input[type=text]{
  display:block;width:100%;padding:10px 14px;background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--tx);
  font:15px 'Nunito Sans',sans-serif;outline:none;transition:border-color .2s;
}
input[type=text]:focus{border-color:rgba(201,168,76,.3)}

/* Class chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:6px 13px;border-radius:6px;cursor:pointer;font:600 12px 'Nunito Sans',sans-serif;
  border:2px solid var(--bdr);background:rgba(0,0,0,.2);color:var(--tx3);transition:all .15s;user-select:none;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;
}
.chip:hover{border-color:rgba(255,255,255,.12)}

/* Role chips */
.rchips{display:flex;gap:8px}
.rchip{
  padding:10px 0;border-radius:8px;cursor:pointer;font:600 14px 'Nunito Sans',sans-serif;
  border:2px solid var(--bdr);background:rgba(0,0,0,.2);color:var(--tx3);
  transition:all .15s;flex:1;text-align:center;user-select:none;
  min-height:44px;display:flex;align-items:center;justify-content:center;
}

/* Timeline grid */
.tl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tl-table{border-collapse:collapse;user-select:none}
.tl-table th{font-size:10px;color:var(--tx4);padding:2px 0;text-align:center;font-weight:500}
.tl-table .dl{font-size:13px;color:#9a92a8;padding:4px 8px 4px 0;font-weight:500;white-space:nowrap;text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.tl-cell{width:14px;min-width:14px;height:32px;border:1px solid rgba(255,255,255,.03);cursor:pointer;background:rgba(0,0,0,.2);transition:background .1s;padding:0}
.tl-cell.hstart{border-left:2px solid rgba(255,255,255,.1)}
.tl-cell.on{background:var(--grn-bg);border-color:var(--grn-bd)}
.tl-cell.tent{background:var(--ylw-bg);border-color:var(--ylw-bd)}
.tl-cell:hover{background:rgba(255,255,255,.06)}
.tl-cell.on:hover{background:rgba(76,175,80,.25)}
.tl-cell.tent:hover{background:rgba(229,194,68,.25)}

/* Buttons */
.brow{display:flex;gap:10px;margin-top:6px}
.btn-p{
  flex:1;padding:12px 0;border-radius:8px;border:none;cursor:pointer;
  font:700 15px 'Nunito Sans',sans-serif;transition:all .2s;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--bg);
}
.btn-p:disabled{background:rgba(255,255,255,.05);color:#4a4458;cursor:not-allowed}
.btn-s{padding:12px 24px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:none;color:var(--tx2);cursor:pointer;font:14px 'Nunito Sans',sans-serif}

/* Roster */
.entry{
  background:var(--card);border-radius:10px;border:1px solid var(--bdr);
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.e-info{min-width:150px}
.e-name{font-weight:700;font-size:15px}
.e-class{font-size:12px;color:var(--tx3);margin-top:2px}
.e-roles{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rbadge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.e-slots{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.stag{font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(76,175,80,.1);color:var(--grn);white-space:nowrap}
.stag.tent{background:var(--ylw-bg);color:var(--ylw)}
.e-notes{font-size:11px;color:#a89cbc;font-style:italic;width:100%;margin-top:2px}
.e-actions{display:flex;gap:4px}
.e-actions button{background:none;border:none;cursor:pointer;font:12px 'Nunito Sans',sans-serif;padding:4px 8px}
.btn-edit{color:var(--tx3)}
.btn-edit:hover{color:var(--gold)}
.btn-del{color:#c06060}
.btn-del:hover{color:var(--dps)}

/* Role summary */
.rsumm{display:flex;gap:10px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.rcard{text-align:center;flex:1;max-width:200px;padding:12px 24px}
.rcard .num{font-size:22px;font-weight:700}
.rcard .rl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.rcard .ico{font-size:22px}
.rcls-list{border-top:1px solid var(--bdr);padding-top:8px;text-align:left}
.rcls-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.rcls-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rcls-name{flex:1;font-weight:500}
.rcls-ct{color:var(--tx3);font-size:11px;font-weight:600}
.rcls-empty{font-size:11px;color:var(--tx4);padding:2px 0}
.sort-bar{font-size:13px;color:var(--tx3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sort-sel{background:var(--c2);color:var(--tx1);border:1px solid var(--bdr);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer}
.sort-sel:focus{outline:none;border-color:rgba(201,168,76,.4)}

/* Heatmap */
.htable{width:100%;border-collapse:separate;border-spacing:5px}
.htable th{font-size:11px;color:var(--tx4);font-weight:500;padding:6px}
.htable .dl{font-size:13px;color:#9a92a8;font-weight:500;padding:4px 10px 4px 0;white-space:nowrap;text-align:left;position:sticky;left:0;background:var(--bg2);z-index:1}
.hcell{border-radius:8px;padding:10px 6px;text-align:center;font-weight:700;font-size:16px;transition:all .3s;position:relative;cursor:default}
.hcell-roles{font-size:9px;font-weight:500;color:var(--tx3);margin-top:3px;white-space:nowrap}
.hcell.raid-ready{outline:2px solid var(--grn);outline-offset:-2px}
.tooltip{
  position:fixed;z-index:999;
  background:#1a1828;border:1px solid rgba(201,168,76,.25);border-radius:8px;padding:8px 12px;
  min-width:160px;font-size:11px;font-weight:400;color:var(--tx);text-align:left;
  box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none;
  opacity:0;transition:opacity .15s;
}
.tooltip.show{opacity:1}
.tooltip::after{content:'';position:absolute;left:var(--arrow-left,50%);transform:translateX(-50%);border:6px solid transparent}
.tooltip.arrow-down::after{top:100%;border-top-color:#1a1828}
.tooltip.arrow-up::after{bottom:100%;border-bottom-color:#1a1828}

/* Section label */
.sec-l{font-size:11px;color:var(--tx4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}

/* Heat toggle */
.heat-toggle{display:flex;gap:0;justify-content:center;margin-bottom:18px}
.ht-btn{padding:8px 20px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2);color:var(--tx3);cursor:pointer;font:600 13px 'Nunito Sans',sans-serif;transition:all .15s}
.ht-btn:first-child{border-radius:6px 0 0 6px}
.ht-btn+.ht-btn{border-left:none}
.ht-btn:last-child{border-radius:0 6px 6px 0}
.ht-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--bg);border-color:var(--gold-d)}

/* Top slots */
.top-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.tslot{border-radius:8px;padding:10px 18px;text-align:center}
.tslot .ts-t{font-weight:700;font-size:14px}
.tslot .ts-c{font-size:12px;color:var(--tx3);margin-top:2px}

/* Analytics bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{font-size:13px;font-weight:600;min-width:110px}
.bar-track{flex:1;height:22px;border-radius:6px;background:rgba(255,255,255,.03);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .5s}
.bar-val{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700}

/* Role analytics */
.role-an{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.role-an-item{text-align:center;min-width:100px}
.role-an-item .big{font-size:28px;font-weight:700}
.role-an-item .sm{font-size:12px;color:var(--tx3)}
.rprog{margin-top:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden}
.rprog-f{height:100%;border-radius:3px;transition:width .5s}
.flex-info{text-align:center;margin-top:12px;font-size:12px;color:var(--tx4)}

/* Best slot detail */
.bs-card{border-radius:10px;padding:16px;margin-bottom:10px}
.bs-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.bs-hdr .rank{font-weight:700;font-size:15px}
.bs-hdr .avail{font-size:12px;color:var(--tx3)}
.bs-roles{display:flex;gap:16px;flex-wrap:wrap}
.bs-role{min-width:120px}
.bs-role-t{font-size:11px;font-weight:600;margin-bottom:4px}
.bs-player{font-size:12px;margin-bottom:1px}
.badge-rr{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:var(--grn-bg);color:var(--grn);font-weight:700;margin-left:6px}

/* Player availability */
.pbar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pbar-name{font-size:13px;font-weight:600;min-width:110px}
.pbar-track{flex:1;height:18px;border-radius:4px;background:rgba(255,255,255,.03);overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;background:rgba(76,175,80,.25);transition:width .5s}
.pbar-val{font-size:12px;color:var(--grn);min-width:55px;text-align:right}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);
  padding:10px 24px;background:rgba(201,168,76,.92);color:var(--bg);border-radius:8px;
  font-weight:600;font-size:14px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:12px;color:var(--tx3);font-size:14px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--tx4);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite}
.loading-wrap .spinner{width:32px;height:32px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--tx3);padding:24px;font-size:14px}

/* Delete modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--bg2);border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:28px;max-width:380px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.modal-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:8px}
.modal-msg{font-size:14px;color:var(--tx2);margin-bottom:20px;line-height:1.5}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btns button{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font:600 14px 'Nunito Sans',sans-serif;transition:all .2s}
.modal-cancel{background:rgba(255,255,255,.06);color:var(--tx2)}
.modal-cancel:hover{background:rgba(255,255,255,.1)}
.modal-confirm{background:var(--dps);color:#fff}
.modal-confirm:hover{background:#ef5350}

/* Auth bar */
.auth-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px;font-size:13px;color:var(--tx2);min-height:32px}
.auth-bar .auth-user{font-weight:600;color:var(--gold)}
.auth-bar button{background:none;border:1px solid rgba(255,255,255,.1);color:var(--tx2);padding:5px 14px;border-radius:6px;cursor:pointer;font:600 12px 'Nunito Sans',sans-serif;transition:all .2s}
.auth-bar button:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}
.auth-bar .btn-logout{border-color:rgba(255,255,255,.06);color:var(--tx3);font-weight:400}

/* Auth overlay */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1001;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.auth-box{background:var(--bg2);border:1px solid rgba(201,168,76,.25);border-radius:14px;padding:32px;max-width:380px;width:92%;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.auth-box h2{font-family:'Cinzel',serif;font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;text-align:center}
.auth-tabs{display:flex;gap:0;margin-bottom:20px}
.auth-tab{flex:1;padding:9px 0;text-align:center;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2);color:var(--tx3);cursor:pointer;font:600 13px 'Nunito Sans',sans-serif;transition:all .15s}
.auth-tab:first-child{border-radius:6px 0 0 6px}
.auth-tab:last-child{border-radius:0 6px 6px 0;border-left:none}
.auth-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--bg);border-color:var(--gold-d)}
.auth-input{display:block;width:100%;padding:10px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--tx);font:15px 'Nunito Sans',sans-serif;outline:none;margin-bottom:12px;transition:border-color .2s}
.auth-input:focus{border-color:rgba(201,168,76,.3)}
.auth-err{color:#e57373;font-size:12px;margin-bottom:10px;min-height:16px}
.auth-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;padding:4px}
.auth-close:hover{color:var(--tx)}
.auth-hint{text-align:center;padding:20px;color:var(--tx3);font-size:14px}
.auth-hint button{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--bg);border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font:600 13px 'Nunito Sans',sans-serif;margin-top:8px}

/* CSV export button */
.btn-export{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:1px solid rgba(201,168,76,.3);background:rgba(201,168,76,.08);color:var(--gold);cursor:pointer;font:600 13px 'Nunito Sans',sans-serif;transition:all .2s;margin-bottom:16px}
.btn-export:hover{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.5)}

/* Responsive */
@media(max-width:640px){
  h1{font-size:26px}
  .rchips{flex-direction:column}
  .rsumm{flex-direction:column;align-items:center}
  .entry{padding:12px 14px;gap:10px}
  .e-info{min-width:auto;width:100%}
  .bs-roles{flex-direction:column}
  .toast{left:12px;right:12px;transform:translateX(0) translateY(40px);text-align:center}
  .toast.show{transform:translateX(0) translateY(0)}
}

/* Hidden */
.hidden{display:none!important}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="wrap">
  <!-- Auth bar -->
  <div id="auth-bar"></div>

  <!-- Header -->
  <div class="center" style="margin-bottom:32px">
    <div class="guild">&lt;Vanilla&gt;</div>
    <h1>Raid-Verfügbarkeit</h1>
    <div class="sub">The Burning Crusade</div>
    <div class="cnt" id="counter"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs" role="tablist">
    <button class="tab on" data-v="form" role="tab" aria-selected="true" aria-controls="v-form" id="tab-form">Eintragen</button>
    <button class="tab" data-v="roster" role="tab" aria-selected="false" aria-controls="v-roster" id="tab-roster">Aufstellung</button>
    <button class="tab" data-v="heatmap" role="tab" aria-selected="false" aria-controls="v-heatmap" id="tab-heatmap">Heatmap</button>
    <button class="tab" data-v="analytics" role="tab" aria-selected="false" aria-controls="v-analytics" id="tab-analytics">Auswertung</button>
  </div>

  <!-- VIEWS -->
  <div id="v-form" role="tabpanel" aria-labelledby="tab-form"></div>
  <div id="v-roster" class="hidden" role="tabpanel" aria-labelledby="tab-roster"></div>
  <div id="v-heatmap" class="hidden" role="tabpanel" aria-labelledby="tab-heatmap"></div>
  <div id="v-analytics" class="hidden" role="tabpanel" aria-labelledby="tab-analytics"></div>
</div>
<div id="auth-overlay"></div>
<div class="toast" id="toast"></div>
<div class="tooltip" id="htooltip"></div>

<script>
// ── Constants ──
const CLS=[
  {n:"Druide",c:"#FF7C0A"},{n:"Hexenmeister",c:"#8788EE"},{n:"Jäger",c:"#AAD372"},
  {n:"Krieger",c:"#C69B6D"},{n:"Magier",c:"#3FC7EB"},{n:"Paladin",c:"#F48CBA"},
  {n:"Priester",c:"#FFFFFF"},{n:"Schamane",c:"#0070DD"},{n:"Schurke",c:"#FFF468"},
];
const ROLES=["Tank","Heiler","DPS"];
const RI={Tank:"\u{1F6E1}\uFE0F",Heiler:"\u{1F49A}",DPS:"\u2694\uFE0F"};
const RC={Tank:"#5b9bd5",Heiler:"#66bb6a",DPS:"#e57373"};
const WD=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const WE=["Samstag","Sonntag"];
const DAYS=[...WD,...WE];
const DS={Montag:"Mo",Dienstag:"Di",Mittwoch:"Mi",Donnerstag:"Do",Freitag:"Fr",Samstag:"Sa",Sonntag:"So"};
// 15-min slots from 12:00 to 23:45 (48 slots)
const SLOTS=[];for(let hh=12;hh<24;hh++)for(let mm=0;mm<60;mm+=15)SLOTS.push(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'));
const HOUR_LABELS=[];for(let hh=12;hh<24;hh++)HOUR_LABELS.push(String(hh).padStart(2,'0'));
function slotsFor(){return SLOTS}
function addMins(t,m){const[h,n]=t.split(':').map(Number);const s=h*60+n+m;return String(Math.floor(s/60)%24).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function hourQuarters(hLabel){return[0,15,30,45].map(m=>hLabel+':'+String(m).padStart(2,'0'))}
function migrateLegacyAvail(av){
  if(!av||typeof av!=='object')return{};
  const out={};
  for(const[k,v] of Object.entries(av)){
    const sep=k.indexOf('_');if(sep<0)continue;
    const day=k.substring(0,sep),slot=k.substring(sep+1),val=v===true?'yes':v;
    if(slot.includes('\u2013')){
      const[st,en]=slot.split('\u2013');
      const[sh,sm]=st.split(':').map(Number);let[eh,em]=en.split(':').map(Number);
      if(eh===0&&em===0)eh=24;
      for(let t=sh*60+sm;t<eh*60+em;t+=15){
        const tk=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
        out[day+'_'+tk]=val;
      }
    }else{out[k]=val}
  }
  return out;
}
function collapseRanges(avail,day){
  const ds=SLOTS.filter(s=>avail[day+'_'+s]);
  if(!ds.length)return[];
  const ranges=[];let rs=ds[0],re=ds[0],rt=avail[day+'_'+ds[0]];
  for(let i=1;i<ds.length;i++){
    const s=ds[i],v=avail[day+'_'+s];
    if(SLOTS.indexOf(s)===SLOTS.indexOf(re)+1&&v===rt){re=s}
    else{ranges.push({start:rs,end:addMins(re,15),type:rt});rs=s;re=s;rt=v}
  }
  ranges.push({start:rs,end:addMins(re,15),type:rt});
  return ranges;
}

// ── Auth API ──
async function authApi(action,data){
  const hdrs={"Content-Type":"application/json"};
  if(currentUser?.token)hdrs["Authorization"]="Bearer "+currentUser.token;
  const r=await fetch("/api/auth",{method:"POST",headers:hdrs,body:JSON.stringify({action,...data})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||"Auth-Fehler");
  return j;
}
function authHeader(){
  if(currentUser?.token)return{Authorization:"Bearer "+currentUser.token};
  return{};
}

// ── Auth UI ──
function renderAuthBar(){
  const el=document.getElementById("auth-bar");
  if(currentUser){
    el.innerHTML=`<div class="auth-bar">Eingeloggt als <span class="auth-user">${h(currentUser.username)}</span> <button class="btn-logout" onclick="doLogout()">Abmelden</button></div>`;
  }else{
    el.innerHTML=`<div class="auth-bar"><button onclick="renderAuthOverlay(true)">Anmelden</button></div>`;
  }
}
let authMode="login";
function renderAuthOverlay(show){
  const el=document.getElementById("auth-overlay");
  if(!show){el.innerHTML="";return}
  const isReg=authMode==="register";
  el.innerHTML=`<div class="auth-overlay">
    <div class="auth-box" style="position:relative">
      <button class="auth-close" onclick="renderAuthOverlay(false)">&times;</button>
      <h2>${isReg?"Registrieren":"Anmelden"}</h2>
      <div class="auth-tabs">
        <button class="auth-tab${!isReg?" active":""}" onclick="authMode='login';renderAuthOverlay(true)">Anmelden</button>
        <button class="auth-tab${isReg?" active":""}" onclick="authMode='register';renderAuthOverlay(true)">Registrieren</button>
      </div>
      <input class="auth-input" id="auth-user" type="text" placeholder="Benutzername" autocomplete="username">
      <input class="auth-input" id="auth-pass" type="password" placeholder="Passwort" autocomplete="${isReg?"new-password":"current-password"}">
      ${isReg?'<input class="auth-input" id="auth-pass2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">':""}
      <div class="auth-err" id="auth-err"></div>
      <button class="btn-p" style="width:100%" onclick="doAuth()">${isReg?"Registrieren":"Anmelden"}</button>
    </div>
  </div>`;
  document.getElementById("auth-user").focus();
  // Allow Enter to submit
  el.querySelectorAll(".auth-input").forEach(inp=>{
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")doAuth()});
  });
  // Click overlay bg to close
  el.querySelector(".auth-overlay").addEventListener("click",e=>{if(e.target===e.currentTarget)renderAuthOverlay(false)});
}
window.doAuth=async function(){
  const user=document.getElementById("auth-user")?.value.trim();
  const pass=document.getElementById("auth-pass")?.value;
  const errEl=document.getElementById("auth-err");
  if(!user||!pass){if(errEl)errEl.textContent="Bitte alle Felder ausfüllen";return}
  if(authMode==="register"){
    const pass2=document.getElementById("auth-pass2")?.value;
    if(pass!==pass2){if(errEl)errEl.textContent="Passwörter stimmen nicht überein";return}
  }
  try{
    const res=await authApi(authMode==="register"?"register":"login",{username:user,password:pass});
    currentUser={token:res.token,username:res.username,userId:res.userId};
    localStorage.setItem("raid-auth",JSON.stringify(currentUser));
    renderAuthOverlay(false);
    renderAuthBar();
    updateAll();
    toast(authMode==="register"?"Registrierung erfolgreich ✓":"Angemeldet ✓");
  }catch(e){if(errEl)errEl.textContent=e.message}
};
window.doLogout=async function(){
  try{await authApi("logout")}catch(e){}
  currentUser=null;
  localStorage.removeItem("raid-auth");
  renderAuthBar();
  updateAll();
  toast("Abgemeldet");
};
async function initAuth(){
  const stored=localStorage.getItem("raid-auth");
  if(stored){
    try{
      const data=JSON.parse(stored);
      currentUser=data;
      const res=await authApi("validate");
      currentUser={...data,username:res.username,userId:res.userId};
    }catch(e){
      currentUser=null;
      localStorage.removeItem("raid-auth");
    }
  }
  renderAuthBar();
  renderForm();
  load();
}

// ── API ──
const API="/api/entries";
async function load(){
  // Show loading spinner in active view
  const activeEl=document.getElementById("v-"+view);
  if(activeEl && !activeEl.classList.contains("hidden")){
    activeEl.innerHTML='<div class="loading-wrap"><div class="spinner"></div>Lade Daten...</div>';
  }
  try{
    const r=await fetch(API,{headers:authHeader()});
    if(!r.ok)throw new Error("Laden fehlgeschlagen");
    const data=await r.json();
    entries=Array.isArray(data)?data:[];
    // Normalize legacy entries: convert old 2h range keys to 15-min keys, true → "yes"
    entries.forEach(e=>{
      if(e.availability){
        e.availability=migrateLegacyAvail(e.availability);
      }
    });
  }catch(e){console.error(e);entries=[]}
  updateAll();
}
async function save(data){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify(data)});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Speichern fehlgeschlagen")}
  return r.json();
}
async function del(id){
  const r=await fetch(API+"?id="+encodeURIComponent(id),{method:"DELETE",headers:authHeader()});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Löschen fehlgeschlagen")}
}

// ── Modal ──
function showModal(title,msg,onConfirm){
  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.innerHTML=`<div class="modal">
    <div class="modal-title">${title}</div>
    <div class="modal-msg">${msg}</div>
    <div class="modal-btns">
      <button class="modal-cancel">Abbrechen</button>
      <button class="modal-confirm">Bestätigen</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const cancelBtn=bg.querySelector(".modal-cancel");
  const confirmBtn=bg.querySelector(".modal-confirm");
  function close(){bg.remove()}
  cancelBtn.addEventListener("click",close);
  confirmBtn.addEventListener("click",()=>{close();onConfirm()});
  bg.addEventListener("click",e=>{if(e.target===bg)close()});
  document.addEventListener("keydown",function esc(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc)}});
  confirmBtn.focus();
}

// ── Helpers ──
function cc(n){return CLS.find(c=>c.n===n)?.c||"#ccc"}
function h(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// Heatmap: aggregate per hour (player counts as available if ALL 4 quarters are marked)
function heatData(){
  const hd={};
  DAYS.forEach(d=>HOUR_LABELS.forEach(hl=>{
    const k=d+"_"+hl;
    const qs=hourQuarters(hl).map(q=>d+"_"+q);
    let yes=0,tent=0;
    entries.forEach(e=>{
      const vals=qs.map(q=>e.availability?.[q]);
      const allAvail=vals.every(v=>v==="yes"||v===true||v==="tentative");
      if(!allAvail)return;
      if(vals.every(v=>v==="yes"||v===true))yes++;else tent++;
    });
    hd[k]={yes,tent,total:yes+tent};
  }));
  return hd;
}

function avForSlot(d,hl){
  const qs=hourQuarters(hl).map(q=>d+"_"+q);
  return entries.filter(e=>{
    return qs.every(q=>e.availability?.[q]);
  }).map(e=>{
    const allYes=qs.every(q=>{const v=e.availability[q];return v==="yes"||v===true});
    return{...e,_availType:allYes?"yes":"tentative"};
  });
}

function isRaidReady(players){
  let t=0,hl=0,dp=0;
  players.forEach(p=>{
    const roles=p.roles||[];
    if(roles.includes("Tank"))t++;
    if(roles.includes("Heiler"))hl++;
    if(roles.includes("DPS"))dp++;
  });
  return{t,hl,dp,ready:t>=RR_TANK&&hl>=RR_HEAL&&dp>=RR_DPS};
}

  else form.roles=[...form.roles,r];

// Drag-to-paint for timeline cells
let _painting=false, _paintState=null;
function applyPaint(k,cell){
  if(_paintState===null)delete form.avail[k];
  else form.avail[k]=_paintState;
  if(cell){
    cell.classList.remove("on","tent");
    if(_paintState==="yes")cell.classList.add("on");
    else if(_paintState==="tentative")cell.classList.add("tent");
  }
}
(function(){
  const formEl=document.getElementById("v-form");
  formEl.addEventListener("mousedown",function(e){
    const cell=e.target.closest(".tl-cell");
    if(!cell||!cell.dataset.k)return;
    e.preventDefault();
    _painting=true;
    const k=cell.dataset.k,cur=form.avail[k];
    if(!cur)_paintState="yes";
    else if(cur==="yes")_paintState="tentative";
    else _paintState=null;
    applyPaint(k,cell);
  });
  formEl.addEventListener("mousemove",function(e){
    if(!_painting)return;
    const cell=e.target.closest(".tl-cell");
    if(cell&&cell.dataset.k)applyPaint(cell.dataset.k,cell);
  });
  document.addEventListener("mouseup",function(){if(_painting){_painting=false}});
  // Touch support
  formEl.addEventListener("touchstart",function(e){
    const cell=e.target.closest(".tl-cell");
    if(!cell||!cell.dataset.k)return;
    e.preventDefault();
    _painting=true;
    const k=cell.dataset.k,cur=form.avail[k];
    if(!cur)_paintState="yes";
    else if(cur==="yes")_paintState="tentative";
    else _paintState=null;
    applyPaint(k,cell);
  },{passive:false});
  formEl.addEventListener("touchmove",function(e){
    if(!_painting)return;
    const t=e.touches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el){const cell=el.closest(".tl-cell");if(cell&&cell.dataset.k)applyPaint(cell.dataset.k,cell)}
  },{passive:true});
  document.addEventListener("touchend",function(){if(_painting){_painting=false}});
})();
window.updBtn=function(){
  const b=document.getElementById("f-submit");
  if(b)b.disabled=!(form.name.trim()&&form.cls&&form.roles.length>0);
};

    await save({id:editId||undefined,charName:form.name,className:form.cls,roles:form.roles,availability:form.avail,notes:form.notes});
    toast(editId?"Eintrag aktualisiert \u2713":"Eintrag gespeichert \u2713");
    editId=null;form={name:"",cls:"",roles:[],avail:{},notes:""};
    document.querySelector('[data-v="form"]').textContent="Eintragen";
    await load();
    switchTab("roster");renderRoster();
  }catch(e){
    if(e.message==="Nicht angemeldet"||e.message==="Sitzung ungültig"){
      currentUser=null;localStorage.removeItem("raid-auth");renderAuthBar();renderForm();
      toast("Sitzung abgelaufen — bitte erneut anmelden");
    }else if(e.message==="Keine Berechtigung"){
      toast("Du kannst nur eigene Einträge bearbeiten");
    }else{toast("Fehler: "+e.message)}
    btn.disabled=false;btn.textContent=editId?"Aktualisieren":"Eintragen";
  }
};
window.cancelEdit=function(){
  editId=null;form={name:"",cls:"",roles:[],avail:{},notes:""};
  document.querySelector('[data-v="form"]').textContent="Eintragen";
  renderForm();
};
window.startEdit=function(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  editId=id;
  form={name:e.charName,cls:e.className,roles:e.roles||[e.role].filter(Boolean),avail:migrateLegacyAvail(e.availability),notes:e.notes||""};
  document.querySelector('[data-v="form"]').textContent="Bearbeiten";
  switchTab("form");renderForm(true);
};
window.delEntry=async function(id){
  const e=entries.find(x=>x.id===id);
  const name=e?e.charName:"diesen Eintrag";
  showModal("Eintrag l\u00F6schen",`Soll der Eintrag von <strong>${h(name)}</strong> wirklich gel\u00F6scht werden?`,async()=>{
    try{await del(id);toast("Gel\u00F6scht");await load()}catch(err){
      if(err.message==="Nicht angemeldet"||err.message==="Sitzung ung\u00FCltig"){
        currentUser=null;localStorage.removeItem("raid-auth");renderAuthBar();updateAll();
        toast("Sitzung abgelaufen \u2014 bitte erneut anmelden");
      }else if(err.message==="Keine Berechtigung"){toast("Du kannst nur eigene Eintr\u00E4ge l\u00F6schen")}
      else{toast("Fehler beim L\u00F6schen")}
    }
  });
};

// ══════════════════════════════
//  ROSTER
// ══════════════════════════════
function renderRoster(){
  const el=document.getElementById("v-roster");
  const rc=ROLES.map(r=>{
    const members=entries.filter(e=>(e.roles||[]).includes(r));
    const classCounts={};
    members.forEach(e=>{const cn=e.className;classCounts[cn]=(classCounts[cn]||0)+1});
    const classes=Object.entries(classCounts).sort((a,b)=>b[1]-a[1]).map(([cn,ct])=>({name:cn,count:ct,color:cc(cn)}));
    return{r,c:members.length,classes};
  });

  let html=`<div class="rsumm">${rc.map(({r,c,classes})=>{
    const clsHtml=classes.length?classes.map(cl=>`<div class="rcls-row"><span class="rcls-dot" style="background:${cl.color}"></span><span class="rcls-name" style="color:${cl.color}">${h(cl.name)}</span><span class="rcls-ct">${cl.count}</span></div>`).join(""):`<div class="rcls-empty">—</div>`;
    return`<div class="card rcard"><div class="ico">${RI[r]}</div><div class="num" style="color:${RC[r]}">${c}</div><div class="rl">${r}</div><div class="rcls-list">${clsHtml}</div></div>`;
  }).join("")}</div>`;

  if(entries.length){
    html+=`<div style="margin-bottom:16px"><button class="btn-export" onclick="exportCSV()">\u{1F4BE} CSV Export</button></div>`;
  }

  if(currentUser&&entries.length&&!entries.some(e=>e.userId===currentUser.userId)){
    const unclaimed=entries.filter(e=>!e.userId);
    if(unclaimed.length){
      html+=`<div class="card" style="border:1px solid rgba(201,168,76,.3);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--tx3)">
        \u{1F4CC} Du hast noch keinen Charakter mit deinem Account verkn\u00FCpft. Klicke bei deinem Eintrag auf <strong style="color:var(--tx)">Bearbeiten</strong> und speichere ihn \u2014 dann geh\u00F6rt er dir.</div>`;
    }
  }

  if(!entries.length){html+=`<div class="empty">Noch keine Eintr\u00E4ge. Sei der Erste!</div>`;el.innerHTML=html;return}

  html+=`<div class="sort-bar">Sortieren: <select class="sort-sel" onchange="rosterSort=this.value;renderRoster()">
    <option value="name"${rosterSort==="name"?" selected":""}>Name</option>
    <option value="class"${rosterSort==="class"?" selected":""}>Klasse</option>
    <option value="role"${rosterSort==="role"?" selected":""}>Rolle</option>
  </select></div>`;

  const sortedEntries=[...entries].sort((a,b)=>{
    if(rosterSort==="class"){
      const ci=CLS.findIndex(c=>c.n===a.className)-CLS.findIndex(c=>c.n===b.className);
      return ci||a.charName.localeCompare(b.charName);
    }
    if(rosterSort==="role"){
      const ra=(a.roles||[])[0]||"",rb=(b.roles||[])[0]||"";
      const ri=ROLES.indexOf(ra)-ROLES.indexOf(rb);
      return ri||a.charName.localeCompare(b.charName);
    }
    return a.charName.localeCompare(b.charName);
  });

  sortedEntries.forEach(e=>{
    const roles=(e.roles||[e.role].filter(Boolean)).filter(r=>ROLES.includes(r));
    const slotTags=DAYS.flatMap(d=>collapseRanges(e.availability||{},d).map(r=>{
      const isTent=r.type==="tentative";
      return`<span class="stag${isTent?" tent":""}">${isTent?"? ":""}${DS[d]} ${r.start}\u2013${r.end}</span>`;
    }));
    html+=`<div class="entry">
      <div class="e-info">
        <div class="e-name" style="color:${cc(e.className)}">${h(e.charName)}</div>
        <div class="e-class">${h(e.className)}</div>
        <div class="e-roles">${roles.map(r=>`<span class="rbadge" style="background:${RC[r]}18;color:${RC[r]}">${RI[r]} ${r}</span>`).join("")}</div>
      </div>
      <div class="e-slots">${slotTags.length?slotTags.join(""):`<span style="font-size:11px;color:var(--tx5)">Keine Zeiten</span>`}</div>
      ${e.notes?`<div class="e-notes">\u201E${h(e.notes)}\u201C</div>`:""}
      ${currentUser&&(!e.userId||e.userId===currentUser.userId)?`<div class="e-actions">
        <button class="btn-edit" data-edit="${h(e.id)}">Bearbeiten</button>
        <button class="btn-del" data-del="${h(e.id)}" aria-label="Eintrag von ${h(e.charName)} l\u00F6schen">\u2715</button>
      </div>`:""}
    </div>`;
  });
  el.innerHTML=html;
}

// ══════════════════════════════
//  HEATMAP
// ══════════════════════════════
function renderHeatmap(){
  const el=document.getElementById("v-heatmap");
  const is3h=heatMode==="3h",is4h=heatMode==="4h",isWindow=is3h||is4h;
  const hd=is4h?heatData4h():is3h?heatData3h():heatData();
  const mx=Math.max(1,...Object.values(hd).map(v=>v.total));

  function makeCell(k,players,dat){
    const c=dat.total,i=c/mx;
    const rr=isRaidReady(players);
    const rrCls=rr.ready?" raid-ready":"";
    let roleBadges="";
    if(c>0) roleBadges=`<div class="hcell-roles"><span style="color:var(--tank)">${rr.t}T</span> <span style="color:var(--heal)">${rr.hl}H</span> <span style="color:var(--dps)">${rr.dp}D</span></div>`;
    let tipHdr="";
    if(c>0) tipHdr=`<div style="margin-bottom:4px;font-weight:600">${RI.Tank}${rr.t} ${RI.Heiler}${rr.hl} ${RI.DPS}${rr.dp}${rr.ready?' \u2014 <span style="color:var(--grn)">Raid-Ready!</span>':""}</div>`;
    const tipPlayers=players.length?players.map(p=>`<div style="color:${p._availType==="tentative"?"var(--ylw)":cc(p.className)}">${p._availType==="tentative"?"(?) ":""}${h(p.charName)}</div>`).join(""):`<div style="color:var(--tx4)">Niemand</div>`;
    let countStr=c.toString();
    if(dat.tent>0) countStr=`${dat.yes}<span style="font-size:12px;font-weight:400;color:var(--ylw)">+${dat.tent}</span>`;
    return`<td><div class="hcell${rrCls}" style="background:${c?`rgba(201,168,76,${.08+i*.35})`:"rgba(255,255,255,.02)"};color:${c?`rgba(201,168,76,${.4+i*.6})`:"#2a2538"};border:1px solid rgba(201,168,76,${c?.1+i*.3:.02})">${countStr}${roleBadges}<template class="tip-content">${tipHdr}${tipPlayers}</template></div></td>`;
  }

  function cell1h(d,hl){
    const k=d+"_"+hl;
    return makeCell(k,avForSlot(d,hl),hd[k]||{yes:0,tent:0,total:0});
  }
  function cell3h(d,label){
    const k=d+"_"+label;
    return makeCell(k,avForWindow3h(d,label),hd[k]||{yes:0,tent:0,total:0});
  }
  function cell4h(d,label){
    const k=d+"_"+label;
    return makeCell(k,avForWindow4h(d,label),hd[k]||{yes:0,tent:0,total:0});
  }

  const cols=is4h?windowLabels4h():is3h?windowLabels3h():HOUR_LABELS;
  let wdRows="",weRows="";
  WD.forEach(d=>{wdRows+=`<tr><td class="dl">${d}</td>${cols.map(c=>is4h?cell4h(d,c):is3h?cell3h(d,c):cell1h(d,c)).join("")}</tr>`});
  WE.forEach(d=>{weRows+=`<tr><td class="dl">${d}</td>${cols.map(c=>is4h?cell4h(d,c):is3h?cell3h(d,c):cell1h(d,c)).join("")}</tr>`});

  const sorted=Object.entries(hd).sort((a,b)=>b[1].total-a[1].total).filter(([,v])=>v.total>0).slice(0,5);
  let topHtml="";
  if(sorted.length){
    topHtml=`<div class="center" style="margin-top:20px">
      <div class="sec-l" style="margin-bottom:10px">Top ${Math.min(5,sorted.length)} Raidzeiten${isWindow?` (${is4h?"4h":"3h"})`:""}</div>
      <div class="top-slots">${sorted.map(([k,dat],i)=>{
        const sep=k.indexOf("_"),d=k.substring(0,sep),s=k.substring(sep+1);
        const players=is4h?avForWindow4h(d,s):is3h?avForWindow3h(d,s):avForSlot(d,s);
        const rr=isRaidReady(players);
        return`<div class="tslot" style="background:${i===0?"rgba(201,168,76,.12)":"rgba(255,255,255,.03)"};border:1px solid ${i===0?"rgba(201,168,76,.3)":"var(--bdr)"}">
          <div class="ts-t" style="color:${i===0?"var(--gold)":"#9a92a8"}">#${i+1} ${DS[d]||d} ${isWindow?s:s+":00"}</div>
          <div class="ts-c">${dat.total} Raider${dat.tent>0?` (${dat.tent} vielleicht)`:""}</div>
          ${rr.ready?'<div class="badge-rr" style="margin-top:4px">Raid-Ready!</div>':""}
        </div>`;
      }).join("")}</div>
    </div>`;
  }

  el.innerHTML=`
    <div class="heat-toggle">
      <button class="ht-btn${heatMode==="1h"?" active":""}" onclick="setHeatMode('1h')">1h Stunden</button>
      <button class="ht-btn${heatMode==="3h"?" active":""}" onclick="setHeatMode('3h')">3h Fenster</button>
      <button class="ht-btn${heatMode==="4h"?" active":""}" onclick="setHeatMode('4h')">4h Raid</button>
    </div>
    <p class="center" style="font-size:13px;color:var(--tx3);margin-bottom:16px">Heller = mehr Raider \u00B7 Hover f\u00FCr Details \u00B7 Gr\u00FCner Rand = Raid-Ready${isWindow?` \u00B7 ${is4h?"4h":"3h"} = alle Viertelstunden im Fenster verf\u00FCgbar`:""}</p>
    <div class="card" style="overflow-x:auto">
      <div class="sec-l">Unter der Woche</div>
      <table class="htable"><thead><tr><th></th>${cols.map(s=>`<th>${s}</th>`).join("")}</tr></thead><tbody>${wdRows}</tbody></table>
    </div>
    <div class="card" style="overflow-x:auto">
      <div class="sec-l">Wochenende</div>
      <table class="htable"><thead><tr><th></th>${cols.map(s=>`<th>${s}</th>`).join("")}</tr></thead><tbody>${weRows}</tbody></table>
    </div>
    ${topHtml}`;
}
window.setHeatMode=function(m){heatMode=m;renderHeatmap()};

// ── Heatmap tooltip (body-level, fixed positioning) ──
(function(){
  const tip=document.getElementById("htooltip");
  const view=document.getElementById("v-heatmap");
  view.addEventListener("mouseenter",function(e){
    const cell=e.target.closest(".hcell");
    if(!cell)return;
    const tpl=cell.querySelector(".tip-content");
    if(!tpl)return;
    tip.innerHTML=tpl.innerHTML;
    const r=cell.getBoundingClientRect();
    const tw=tip.offsetWidth||160, th=tip.offsetHeight||40;
    // Prefer above; flip below if near top
    const above=r.top-th-10>0;
    let top=above?r.top-th-10:r.bottom+10;
    let left=r.left+r.width/2-tw/2;
    // Clamp horizontal
    const margin=4;
    if(left<margin)left=margin;
    if(left+tw>window.innerWidth-margin)left=window.innerWidth-margin-tw;
    // Arrow offset
    const cellCenter=r.left+r.width/2;
    const arrowLeft=Math.max(12,Math.min(tw-12,cellCenter-left));
    tip.style.left=left+"px";
    tip.style.top=top+"px";
    tip.style.setProperty("--arrow-left",arrowLeft+"px");
    tip.classList.remove("arrow-down","arrow-up");
    tip.classList.add(above?"arrow-down":"arrow-up");
    tip.classList.add("show");
  },true);
  view.addEventListener("mouseleave",function(e){
    const cell=e.target.closest(".hcell");
    if(!cell)return;
    tip.classList.remove("show","arrow-down","arrow-up");
  },true);
})();

// ══════════════════════════════
//  ANALYTICS
// ══════════════════════════════
function renderAnalytics(){
  const el=document.getElementById("v-analytics");
  if(!entries.length){el.innerHTML=`<div class="empty">Noch keine Daten f\u00FCr die Auswertung.</div>`;return}

  // Roles
  const rc=ROLES.map(r=>({r,c:entries.filter(e=>(e.roles||[]).includes(r)).length}));
  const multi=entries.filter(e=>(e.roles||[]).length>1).length;
  const single=entries.length-multi;

  let roleHtml=`<div class="card"><div class="card-t">Rollenverteilung</div>
    <div class="role-an">${rc.map(({r,c})=>{
      const pct=entries.length?Math.round(c/entries.length*100):0;
      return`<div class="role-an-item">
        <div class="big" style="color:${RC[r]}">${c}</div>
        <div class="sm">${RI[r]} ${r}</div>
        <div class="rprog"><div class="rprog-f" style="width:${pct}%;background:${RC[r]}"></div></div>
        <div style="font-size:10px;color:var(--tx4);margin-top:3px">${pct}%</div>
      </div>`;
    }).join("")}</div>
    <div class="flex-info">${multi} Spieler mit Mehrfachrolle \u00B7 ${single} nur eine Rolle</div>
  </div>`;

  // Classes
  const clsCounts=CLS.map(c=>({...c,count:entries.filter(e=>e.className===c.n).length})).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
  const mxCls=Math.max(1,...clsCounts.map(c=>c.count));

  let clsHtml=`<div class="card"><div class="card-t">Klassenverteilung</div>
    ${clsCounts.map(c=>`<div class="bar-row">
      <span class="bar-lbl" style="color:${c.c}">${c.n}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${c.count/mxCls*100}%;background:${c.c}40"></div><span class="bar-val" style="color:${c.c}">${c.count}\u00D7</span></div>
    </div>`).join("")}
  </div>`;

  // Best slots detail (hourly aggregation)
  const hd=heatData();
  const best=Object.entries(hd).sort((a,b)=>b[1].total-a[1].total).filter(([,v])=>v.total>0).slice(0,3);

  let bestHtml=`<div class="card"><div class="card-t">Beste Raidzeiten \u2014 Details</div>
    ${best.map(([k,dat],i)=>{
      const sep=k.indexOf("_"),d=k.substring(0,sep),hl=k.substring(sep+1);
      const players=avForSlot(d,hl);
      const rr=isRaidReady(players);
      const byRole=ROLES.map(r=>({r,ps:players.filter(p=>(p.roles||[]).includes(r))}));
      return`<div class="bs-card" style="background:${i===0?"rgba(201,168,76,.06)":"rgba(255,255,255,.015)"};border:1px solid ${i===0?"rgba(201,168,76,.2)":"rgba(255,255,255,.04)"}">
        <div class="bs-hdr"><span class="rank" style="color:${i===0?"var(--gold)":"#9a92a8"}">#${i+1} ${d} ${hl}:00</span><span class="avail">${dat.total} verf\u00FCgbar${dat.tent>0?` (${dat.tent} vielleicht)`:""}</span>${rr.ready?'<span class="badge-rr">Raid-Ready!</span>':""}</div>
        <div class="bs-roles">${byRole.map(({r,ps})=>`
          <div class="bs-role">
            <div class="bs-role-t" style="color:${RC[r]}">${RI[r]} ${r} (${ps.length})</div>
            ${ps.length?ps.map(p=>`<div class="bs-player" style="color:${p._availType==="tentative"?"var(--ylw)":cc(p.className)}">${p._availType==="tentative"?"(?) ":""}${h(p.charName)}</div>`).join(""):`<div style="font-size:11px;color:var(--tx5)">\u2014</div>`}
          </div>
        `).join("")}</div>
      </div>`;
    }).join("")}
  </div>`;

  // Player availability ranking (count individual 15-min slots, both yes and tentative)
  const pSlots=entries.map(e=>{
    const cnt=DAYS.reduce((s,d)=>s+SLOTS.filter(sl=>e.availability?.[d+"_"+sl]).length,0);
    return{...e,sc:cnt};
  }).sort((a,b)=>b.sc-a.sc);
  const mxSl=Math.max(1,...pSlots.map(p=>p.sc));

  let playerHtml=`<div class="card"><div class="card-t">Verf\u00FCgbarkeit pro Spieler</div>
    ${pSlots.map(p=>`<div class="pbar-row">
      <span class="pbar-name" style="color:${cc(p.className)}">${h(p.charName)}</span>
      <div class="pbar-track"><div class="pbar-fill" style="width:${p.sc/mxSl*100}%"></div></div>
      <span class="pbar-val">${p.sc} Slots</span>
    </div>`).join("")}
  </div>`;

  el.innerHTML=roleHtml+clsHtml+bestHtml+playerHtml;
}

// ══════════════════════════════
//  CSV EXPORT
// ══════════════════════════════
window.exportCSV=function(){
  function csvVal(str){
    str=String(str);
    if(str.includes('"')||str.includes(',')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';
    return str;
  }

  // One column per day showing collapsed time ranges
  const header=["Charakter","Klasse","Rollen",...DAYS.map(d=>DS[d]),"Anmerkungen"];
  const rows=[header.map(csvVal).join(",")];

  entries.forEach(e=>{
    const roles=(e.roles||[]).join(", ");
    const cols=[e.charName,e.className,roles];
    DAYS.forEach(d=>{
      const ranges=collapseRanges(e.availability||{},d);
      if(!ranges.length){cols.push("—");return}
      const parts=ranges.map(r=>{
        const prefix=r.type==="tentative"?"? ":"";
        return prefix+r.start+"\u2013"+r.end;
      });
      cols.push(parts.join(", "));
    });
    cols.push(e.notes||"");
    rows.push(cols.map(csvVal).join(","));
  });

  const bom="\uFEFF";
  const blob=new Blob([bom+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="raid-verfuegbarkeit.csv";
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exportiert \u2713");
};
