window.saveDkpConfig=async function(){
  const defaultDecayPercent=Number(document.getElementById("cfg-decay").value);
  const maxDkpAmount=Number(document.getElementById("cfg-max").value);
  const startingBalance=Number(document.getElementById("cfg-start").value);
  const allowNegativeBalance=document.getElementById("cfg-neg").value==="true";
  const transactionLimit=Number(document.getElementById("cfg-txlimit").value);
  const reasonMaxLength=Number(document.getElementById("cfg-reasonlen").value);
  try{
    const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"save-config",defaultDecayPercent,maxDkpAmount,startingBalance,allowNegativeBalance,transactionLimit,reasonMaxLength})});
    if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
    const d=await r.json();
    dkpConfig=d.config;dkpDecayPercent=dkpConfig.defaultDecayPercent;
    const el=document.getElementById("cfg-saved");if(el){el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000)}
    toast("Einstellungen gespeichert");
  }catch(e){
    if(e.message==="Nicht angemeldet"||e.message==="Sitzung ungültig"){
      currentUser=null;localStorage.removeItem("raid-auth");renderAuthBar();renderDkp();
      toast("Sitzung abgelaufen — bitte erneut anmelden");
    }else{toast("Fehler: "+e.message)}
  }
};

// ── Role management ──
window.dkpAddRole=async function(){
  const username=dkpRoleAddUser.trim();
  if(!username){toast("Benutzername eingeben");return}
  try{
    const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"manage-roles",username,role:dkpRoleAddRole})});
    if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
    const d=await r.json();dkpConfig=d.config;dkpRoleAddUser="";
    toast(`${username} als ${dkpRoleAddRole==="admin"?"Admin":"Offizier"} hinzugefügt`);
    renderDkp();
  }catch(e){handleDkpError(e)}
};
window.dkpChangeRole=async function(username,newRole){
  try{
    const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"manage-roles",username,role:newRole})});
    if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
    const d=await r.json();dkpConfig=d.config;
    toast(`${username} ist jetzt ${newRole==="admin"?"Admin":"Offizier"}`);
    renderDkp();
  }catch(e){handleDkpError(e)}
};
window.dkpRemoveRole=async function(username){
  showModal("Rolle entfernen",`Wirklich <strong>${h(username)}</strong> als DKP-Verwalter entfernen?`,async()=>{
    try{
      const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"manage-roles",username,remove:true})});
      if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
      const d=await r.json();dkpConfig=d.config;
      toast(`${username} entfernt`);renderDkp();
    }catch(e){handleDkpError(e)}
  });
};

// ── Sorting ──
window.dkpSortBy=function(col){
  if(dkpSortCol===col){dkpSortDir=dkpSortDir==="asc"?"desc":"asc"}
  else{dkpSortCol=col;dkpSortDir=col==="balance"?"desc":"asc"}
  renderDkp();
};

// ── Player detail ──
window.showDkpPlayerDetail=async function(playerName){
  dkpPlayerDetail=playerName;
  dkpPlayerTx=[];
  renderDkp();
  try{
    const r=await fetch(DKP_API+"?player="+encodeURIComponent(playerName),{headers:authHeader()});
    if(r.ok){const d=await r.json();dkpPlayerTx=d.transactions||[]}
  }catch(e){console.error(e)}
  if(dkpPlayerDetail===playerName)renderDkp();
};

// ── CSV Export ──
window.exportDkpCsv=function(){
  function csvVal(str){str=String(str);if(str.includes('"')||str.includes(',')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';return str}

  // Standings CSV
  let csv="Rang,Spieler,Klasse,DKP,Zuletzt aktualisiert\n";
  const sorted=dkpSortedBalances();
  sorted.forEach((b,i)=>{
    const date=b.lastUpdated?new Date(b.lastUpdated).toLocaleDateString("de-DE"):"";
    csv+=[i+1,csvVal(b.playerName),csvVal(b.className||""),b.balance,date].join(",")+"\n";
  });
  csv+="\n\nTransaktionen\nDatum,Spieler,Typ,Betrag,Grund,Von\n";
  dkpTransactions.forEach(tx=>{
    const date=new Date(tx.timestamp).toLocaleString("de-DE");
    const type=tx.type==="earn"?"Verdient":tx.type==="spend"?"Beute":"Verfall";
    csv+=[csvVal(date),csvVal(tx.playerName),type,tx.amount,csvVal(tx.reason),csvVal(tx.createdBy||"")].join(",")+"\n";
  });

  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="dkp-export-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
};

// ── Undo ──
window.doDkpUndo=function(){
  if(!dkpTransactions.length)return;
  const last=dkpTransactions[0];
  const typeLabel=last.type==="earn"?"Verdient":last.type==="spend"?"Beute":"Verfall";
  const amtStr=last.amount>0?"+"+last.amount:String(last.amount);
  showModal("Letzte Transaktion rückgängig machen",
    `<strong>${typeLabel}</strong>: ${h(last.playerName)} ${amtStr} DKP — „${last.type==="spend"?linkItems(last.reason):h(last.reason)}"<br><br>Diese Aktion macht die Transaktion rückgängig und stellt den vorherigen DKP-Stand wieder her.`,
    async()=>{
      try{
        const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"undo",transactionId:last.id})});
        if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
        toast("Transaktion rückgängig gemacht");
        await loadDkp();renderDkp();
      }catch(e){handleDkpError(e)}
    });
};

function handleDkpError(e){
  if(e.message==="Nicht angemeldet"||e.message==="Sitzung ungültig"){
    currentUser=null;localStorage.removeItem("raid-auth");renderAuthBar();renderDkp();
    toast("Sitzung abgelaufen — bitte erneut anmelden");
  }else{toast("Fehler: "+e.message)}
}

window.dkpTogglePlayer=function(name){
  const idx=dkpAwardPlayers.findIndex(p=>p.name===name);
  if(idx>=0){dkpAwardPlayers.splice(idx,1)}
  else{
    const e=entries.find(x=>x.charName===name);
    dkpAwardPlayers.push({name,className:e?.className||""});
  }
  renderDkp();
};
window.dkpSelectAll=function(){
  if(dkpAwardPlayers.length===entries.length){dkpAwardPlayers=[]}
  else{dkpAwardPlayers=entries.map(e=>({name:e.charName,className:e.className}))}
  dkpAwardRaidId="";
  renderDkp();
};

window.dkpSelectRaid=function(raidId){
  dkpAwardRaidId=raidId;
  if(!raidId){dkpAwardPlayers=[];dkpAwardReason="";renderDkp();return}
  const raid=raids.find(r=>r.id===raidId);
  if(!raid){renderDkp();return}
  const signups=(raid.signups||[]).filter(s=>s.status!=="declined");
  dkpAwardPlayers=signups.map(s=>({name:s.charName,className:s.className||""}));
  dkpAwardReason=raid.instance+" — "+fmtDate(raid.date);
  renderDkp();
};

window.dkpAwardFromRaid=function(raidId){
  dkpAwardRaidId=raidId;
  const raid=raids.find(r=>r.id===raidId);
  if(!raid)return;
  const signups=(raid.signups||[]).filter(s=>s.status!=="declined");
  dkpAwardPlayers=signups.map(s=>({name:s.charName,className:s.className||""}));
  dkpAwardReason=raid.instance+" — "+fmtDate(raid.date);
  dkpAwardAmount="";
  dkpView="award";
  switchTab("dkp");
  renderDkp();
};

window.doDkpAward=async function(){
  if(!dkpAwardPlayers.length||!dkpAwardAmount||!dkpAwardReason)return;
  try{
    const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"award",players:dkpAwardPlayers,amount:Number(dkpAwardAmount),reason:dkpAwardReason})});
    if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
    toast(`${dkpAwardPlayers.length}× ${dkpAwardAmount} DKP vergeben`);
    dkpAwardPlayers=[];dkpAwardAmount="";dkpAwardReason="";dkpAwardRaidId="";
    dkpView="overview";
    await loadDkp();renderDkp();
  }catch(e){handleDkpError(e)}
};

window.doDkpSpend=async function(){
  if(!dkpSpendPlayer||!dkpSpendAmount)return;
  try{
    const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"spend",playerName:dkpSpendPlayer,amount:Number(dkpSpendAmount),itemName:dkpSpendItem})});
    if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
    toast(`${dkpSpendAmount} DKP für ${dkpSpendItem||"Loot"} verbucht`);
    dkpSpendPlayer="";dkpSpendAmount="";dkpSpendItem="";
    dkpView="overview";
    await loadDkp();renderDkp();
  }catch(e){handleDkpError(e)}
};

window.doDkpDecay=async function(){
  showModal("Verfall anwenden",`Wirklich <strong>${dkpDecayPercent}%</strong> Verfall auf alle DKP-Stände anwenden?`,async()=>{
    try{
      const r=await fetch(DKP_API,{method:"POST",headers:{"Content-Type":"application/json",...authHeader()},body:JSON.stringify({action:"decay",percent:dkpDecayPercent})});
      if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error||"Fehler")}
      toast(`${dkpDecayPercent}% Verfall angewendet`);
      dkpView="overview";
      await loadDkp();renderDkp();
    }catch(e){handleDkpError(e)}
  });
};

window.postToDiscord=async function(raidId){
  const btn=document.querySelector(`[data-discord="${raidId}"]`);
  if(btn){btn.disabled=true;btn.innerHTML=dcIco(14)+" Senden...";}
  try{
    const r=await fetch(DISCORD_API,{
      method:"POST",
      headers:{"Content-Type":"application/json",...authHeader()},
      body:JSON.stringify({action:"post",raidId}),
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Fehler beim Senden");
    toast("In Discord gepostet \u2713");
  }catch(e){
    toast("Discord: "+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML=dcIco(14)+" Discord";}
  }
};

// ══════════════════════════════
//  CSV EXPORT
// ══════════════════════════════
window.exportCSV=function(){
  function csvVal(str){
    str=String(str);
    if(str.includes('"')||str.includes(',')||str.includes('\n'))return'"'+str.replace(/"/g,'""')+'"';
    return str;
  }

  // One column per day showing collapsed time ranges
  const header=["Charakter","Klasse","Rollen",...DAYS.map(d=>DS[d]),"Anmerkungen"];
  const rows=[header.map(csvVal).join(",")];

  entries.forEach(e=>{
    const roles=(e.roles||[]).join(", ");
    const cols=[e.charName,e.className,roles];
    DAYS.forEach(d=>{
      const ranges=collapseRanges(e.availability||{},d);
      if(!ranges.length){cols.push("—");return}
      const parts=ranges.map(r=>{
        const prefix=r.type==="tentative"?"? ":"";
        return prefix+r.start+"\u2013"+r.end;
      });
      cols.push(parts.join(", "));
    });
    cols.push(e.notes||"");
    rows.push(cols.map(csvVal).join(","));
  });

  const bom="\uFEFF";
  const blob=new Blob([bom+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="raid-verfuegbarkeit.csv";
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exportiert \u2713");
};
